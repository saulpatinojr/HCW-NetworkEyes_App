# Dependabot — automated dependency updates
# Covers: Python packages (uv — pyproject.toml + uv.lock), GitHub Actions,
# Docker base images (every `FROM` in all four Dockerfiles, including the
# `FROM ghcr.io/astral-sh/uv:… AS uv` stage the Python images copy uv from —
# Dependabot does not read `COPY --from=<image>`), npm (cna-web). Minor/patch
# updates are grouped per ecosystem.
#
# PR strategy:
#   - Python: weekly, grouped by ecosystem, auto-assign to saulpatinojr
#   - Actions: weekly, grouped — keeps CI action SHAs current
#   - Docker: weekly — keeps base image digests current in /, apps/cna-api,
#     apps/cna-worker, apps/cna-web
#
# Cooldown: the uv, npm and github-actions entries set `cooldown.default-days: 7`, so a release must be 7 days old before
# Dependabot opens a version-update pull request for it (Dependabot's own default, with no `cooldown` key, is 3 days). The
# docker entry keeps 3 days, see below. Only `default-days`
# is set: the `semver-*-days` keys are not supported for github-actions and docker. GitHub documents that `cooldown`
# is available for version updates, not security updates, so a security update for uv, npm or github-actions is not
# delayed. Docker is different: Dependabot has no security updates for it, so a longer wait would slow every base-image fix.
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference#cooldown

version: 2
updates:

  # Python dependencies — the `uv` ecosystem, not `pip`: the resolution lives in
  # uv.lock (TODO.md T-702) and every Python image installs from it, so an
  # update must move pyproject.toml and uv.lock together or 300-test-codebase's
  # `uv lock --check` fails the PR.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    cooldown:
      default-days: 7
    assignees:
      - saulpatinojr
    reviewers:
      - saulpatinojr
    labels:
      - dependencies
      - python
    ignore:
      # The Foundry client targets the azure-ai-projects 1.x surface (AIProjectClient.agents, pinned "<2" in
      # pyproject.toml); 2.x moved agents to azure-ai-agents. Majors are adopted by hand with that migration (#193).
      - dependency-name: "azure-ai-projects"
        update-types: ["version-update:semver-major"]
    groups:
      # pydantic pins pydantic-core to one exact version, so the two must move in one pull request; a pydantic-core
      # bump on its own cannot resolve against the pinned pydantic.
      pydantic:
        patterns:
          - "pydantic"
          - "pydantic-core"
      azure-sdk:
        patterns:
          - "azure-*"
      aws-sdk:
        patterns:
          - "boto3"
          - "botocore"
      testing:
        patterns:
          - "pytest*"
          - "ruff"
          - "coverage"
      python-minor-patch:
        update-types:
          - minor
          - patch

  # GitHub Actions
  - package-ecosystem: github-actions
    # "/" covers .github/workflows. There is no local composite action; add "/.github/actions/*" back with the first one.
    directories:
      - "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    cooldown:
      default-days: 7
    assignees:
      - saulpatinojr
    labels:
      - dependencies
      - github-actions
    groups:
      all-actions:
        patterns:
          - "*"

  # Docker — every Dockerfile, not only the root one. Dependabot's docker
  # updater scans the listed directories only, so the api/worker/web images
  # were previously unwatched and their pinned base digests went stale.
  - package-ecosystem: docker
    directories:
      - "/"
      - "/apps/cna-api"
      - "/apps/cna-worker"
      - "/apps/cna-web"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    # No Dependabot security updates exist for docker, and a base-image digest bump is how a Docker Scout finding on a base
    # image is fixed (CLAUDE.md), so this entry keeps Dependabot's own default of 3 days instead of 7.
    cooldown:
      default-days: 3
    assignees:
      - saulpatinojr
    labels:
      - dependencies
      - docker
    ignore:
      # Odd Node majors never reach LTS; the web image moves to the next even major by hand (#185).
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    groups:
      docker-minor-patch:
        update-types:
          - minor
          - patch

  # npm — cna-web (Next.js 15, next-auth, Prisma, Azure SDKs)
  # Previously uncovered — next-auth beta and all Node.js dependencies
  # were not receiving automated update PRs.
  - package-ecosystem: npm
    directory: "/apps/cna-web"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    cooldown:
      default-days: 7
    assignees:
      - saulpatinojr
    reviewers:
      - saulpatinojr
    labels:
      - dependencies
      - npm
    # `typescript` and `@typescript/native` are npm aliases (TypeScript 6 API and TypeScript 7 compiler, side by side).
    # Dependabot only lists direct dependencies that are not aliases, so neither needs an ignore rule;
    # apps/cna-web/lib/typescript-toolchain.test.ts guards the pairing and says when it can end (TODO.md T-731).
    ignore:
      # Prisma 7 requires the new prisma.config.ts datasource model. Keep Prisma
      # major upgrades manual until the schema/runtime migration is implemented.
      - dependency-name: "prisma"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@prisma/*"
        update-types:
          - "version-update:semver-major"
    groups:
      azure-sdk:
        patterns:
          - "@azure/*"
      next-ecosystem:
        patterns:
          - "next"
          - "eslint-config-next"
          - "next-auth"
          - "react"
          - "react-dom"
          - "@types/react*"
      prisma:
        patterns:
          - "prisma"
          - "@prisma/*"
          - "@auth/prisma-adapter"
      npm-minor-patch:
        update-types:
          - minor
          - patch
