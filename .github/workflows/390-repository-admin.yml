name: repository-admin

# Owner-approved repository chores: branch and tag rules, and cleanup of merged branches, plus the board fields and filling them in.
# Every run is a dry run unless "apply" is ticked. The admin-ops environment holds the credentials (main branch only).
# It uses a short-lived GitHub App token (HCW Portfolio Admin), limited to this repository.
# The default token below stays read-only. No secrets are stored in this file.

on:
  workflow_dispatch:
    inputs:
      task:
        description: "What to do. Start with show-plan, then run the same task again with apply ticked."
        type: choice
        required: true
        options:
          - show-plan
          - protect-main
          - protect-release-tags
          - delete-merged-branches
          - board-fields
          - board-fill
      apply:
        description: "Tick to really make the change. Leave unticked for a dry run that only prints what would change."
        type: boolean
        default: false
      allow_weakening:
        description: "Only with apply ticked. Allow the update to remove or weaken something the live ruleset has: a rule, a required check, a bypass actor, a ref pattern, a lower approval count, a protection switched off. Leave unticked: such an update is refused."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: repository-admin
  cancel-in-progress: false

jobs:
  admin:
    name: repository-admin
    runs-on: ubuntu-latest
    environment: admin-ops
    timeout-minutes: 10
    steps:
      - name: Get a short-lived token for this repository only
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-administration: write
          permission-contents: write
          permission-metadata: read

      - name: Run the chosen task
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TASK: ${{ inputs.task }}
          APPLY: ${{ inputs.apply }}
          ALLOW_WEAKENING: ${{ inputs.allow_weakening }}
          # Must equal the required checks of the live "Protect main" ruleset, and every name must be a job name in 300-test-codebase.yml.
          # tests/unit/test_repository_admin_required_checks.py pins both. Change the live ruleset and this list together.
          REQUIRED_CHECKS: '["Lint & Format","Unit Tests (Python 3.14)","Web lint, typecheck & tests","Python Lockfile Consistency","Python Dependency Audit (pip-audit)","Secret Scanning (detect-secrets, gating)","Repository Guardrails","Dockerfile Lint (hadolint)","Workflow Lint (actionlint)","Dependency Review","Image Scan (Trivy)"]'
          KEEP_REGEX: '^(main|master|develop|gh-pages|release/.*)$'
        run: |
          set -euo pipefail
          api() { gh api -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$@"; }
          say() { echo "$*" | tee -a "$GITHUB_STEP_SUMMARY"; }
          mode="DRY RUN, nothing is changed"
          if [ "$APPLY" = "true" ]; then mode="APPLY, changes are made"; fi
          say "## $TASK on $REPO ($mode)"

          # A ruleset update (PUT) replaces the whole live ruleset with the payload built below. So anything the live
          # ruleset has that the payload lacks or lowers (a rule, a required check, a bypass actor, a ref pattern, an
          # approval count, a switch that is on) is dropped without a word. These helpers read the live ruleset first,
          # print the difference, and refuse to apply a removal or a weakening unless "allow_weakening" is ticked.
          # shellcheck disable=SC2016  # jq text: nothing in it is a shell expansion
          DIFF='def facets:
              [ ((.rules // [])[] | "rule: " + .type),
                ((.rules // [])[] | select(.type == "required_status_checks") | (.parameters.required_status_checks // [])[]
                  | "check: " + .context + (if .integration_id then " (integration " + (.integration_id | tostring) + ")" else "" end)),
                ((.bypass_actors // [])[] | "bypass: " + .actor_type + " " + ((.actor_id // "-") | tostring) + " (" + (.bypass_mode // "always") + ")"),
                ((.conditions.ref_name.include // [])[] | "include: " + .),
                ((.conditions.ref_name.exclude // [])[] | "exclude: " + .)
              ] | unique;
            def params:
              [ (.rules // [])[] | .type as $t | (.parameters // {}) | to_entries[]
                | select(.key != "required_status_checks")
                | { t: $t, k: .key, v: .value } ];
            def weaker($k; $lv; $nv):
              if ($lv | type) == "boolean" then
                (if $k == "do_not_enforce_on_create" then ($lv == false and $nv == true) else ($lv == true and $nv != true) end)
              elif ($lv | type) == "number" then (($nv | type) != "number" or $nv < $lv)
              elif ($lv | type) == "array" then ((($lv - ($nv // [])) | length) > 0)
              else $lv != $nv end;
            def pname: .t + "." + .k;
            ($live | params) as $lp | ($new | params) as $np
            | [ $lp[] | . as $p | ([ $np[] | select(.t == $p.t and .k == $p.k) ] | first) as $q
                | (if $q == null then null else $q.v end) as $nv
                | select(weaker($p.k; $p.v; $nv))
                | "param: " + ($p | pname) + ": live " + ($p.v | tojson) + ", payload " + (if $q == null then "not set" else ($nv | tojson) end) ] as $weaker
            | [ $np[] | . as $q | ([ $lp[] | select(.t == $q.t and .k == $q.k) ] | first) as $p
                | select($p == null or $p.v != $q.v)
                | select($p == null or (weaker($q.k; $p.v; $q.v) | not))
                | "param: " + ($q | pname) + (if $p == null then " = " + ($q.v | tojson) else ": live " + ($p.v | tojson) + " -> payload " + ($q.v | tojson) end) ] as $changed
            | { removed: ((($live | facets) - ($new | facets)) + $weaker),
                added: ((($new | facets) - ($live | facets)) + $changed) }'
          removed=""
          added=""
          live_id=""

          # The id of the live ruleset with this name, or nothing.
          ruleset_id() {
            api --paginate "repos/$REPO/rulesets" | jq -r --arg n "$1" '.[] | select(.name == $n) | .id' | head -n1
          }

          # Reads the live ruleset called $1, compares it with payload $2, prints the difference and sets
          # $live_id (empty when there is no such ruleset), $removed (what the update would remove or weaken) and $added.
          compare_ruleset() {
            local name="$1" payload="$2" live_json result
            removed=""
            added=""
            live_id=$(ruleset_id "$name")
            if [ -z "$live_id" ]; then
              say "No live ruleset named '$name' exists, so an update removes nothing."
              return 0
            fi
            live_json=$(api "repos/$REPO/rulesets/$live_id")
            result=$(jq -nc --argjson live "$live_json" --argjson new "$payload" "$DIFF")
            removed=$(jq -r '.removed[]' <<<"$result")
            added=$(jq -r '.added[]' <<<"$result")
            say "Live ruleset '$name' (id $live_id) compared with the payload above:"
            if [ -n "$removed" ]; then
              say "The update would REMOVE or WEAKEN these (they are live and the payload lacks or lowers them):"
              while IFS= read -r line; do say "- $line"; done <<<"$removed"
            else
              say "The update removes and weakens nothing that is live."
            fi
            if [ -n "$added" ]; then
              say "The update would ADD or CHANGE these (not weaker):"
              while IFS= read -r line; do say "- $line"; done <<<"$added"
            else
              say "The update adds and changes nothing."
            fi
          }

          # Create the ruleset if it does not exist, otherwise update it in place. Refuses to apply a removal or weakening that was not asked for.
          upsert_ruleset() {
            local name="$1" payload="$2" id
            say "Ruleset payload for '$name':"
            say '```json'
            say "$payload"
            say '```'
            compare_ruleset "$name" "$payload"
            id="$live_id"
            if [ "$APPLY" != "true" ]; then
              if [ -n "$removed" ]; then
                echo "::warning title=Apply would be refused::The update of '$name' would remove or weaken live settings. Apply refuses unless allow_weakening is ticked."
                say "Apply would be REFUSED unless allow_weakening is also ticked."
              fi
              if [ -n "$id" ]; then say "Would UPDATE the existing ruleset (id $id)."; else say "Would CREATE this ruleset."; fi
              return 0
            fi
            if [ -n "$removed" ]; then
              if [ "${ALLOW_WEAKENING:-false}" != "true" ]; then
                say "REFUSED: applying this would remove or weaken the settings listed above in the live ruleset '$name'. Nothing was changed."
                say "If that is intended, run again with apply and allow_weakening both ticked. Otherwise correct this workflow so the payload keeps them (for the required checks, REQUIRED_CHECKS above), and run again."
                echo "::error title=Refusing to weaken a live ruleset::The update of '$name' would remove or weaken settings that are live. Nothing was changed."
                exit 1
              fi
              say "allow_weakening is ticked: the settings listed above will be removed or weakened."
            fi
            if [ -n "$id" ]; then
              api -X PUT "repos/$REPO/rulesets/$id" --input - <<<"$payload" > /dev/null
              say "Updated ruleset '$name' (id $id)."
            else
              api -X POST "repos/$REPO/rulesets" --input - <<<"$payload" > /dev/null
              say "Created ruleset '$name'."
            fi
          }

          # The payload each ruleset task sends. show-plan builds the same ones to show what a task would remove.
          main_payload() {
            if ! jq -e 'type == "array" and length > 0 and all(.[]; type == "string" and length > 0) and (unique | length) == length' <<<"$REQUIRED_CHECKS" > /dev/null; then
              say "REQUIRED_CHECKS must be a JSON array of unique, non-empty check names." >&2
              exit 1
            fi
            jq -n --argjson checks "$REQUIRED_CHECKS" '{
              name: "Protect main",
              target: "branch",
              enforcement: "active",
              conditions: { ref_name: { include: ["~DEFAULT_BRANCH"], exclude: [] } },
              bypass_actors: [ { actor_id: 5, actor_type: "RepositoryRole", bypass_mode: "pull_request" } ],
              rules: [
                { type: "deletion" },
                { type: "non_fast_forward" },
                { type: "pull_request", parameters: {
                    required_approving_review_count: 1,
                    dismiss_stale_reviews_on_push: true,
                    required_reviewers: [],
                    require_code_owner_review: true,
                    require_last_push_approval: true,
                    required_review_thread_resolution: true,
                    require_extra_approval_for_unattributed_changes: true,
                    allowed_merge_methods: ["merge", "squash", "rebase"] } },
                { type: "required_status_checks", parameters: {
                    strict_required_status_checks_policy: false,
                    do_not_enforce_on_create: false,
                    required_status_checks: ($checks | map({ context: . })) } }
              ] }'
          }
          tags_payload() {
            jq -n '{
              name: "Protect release tags",
              target: "tag",
              enforcement: "active",
              conditions: { ref_name: { include: ["refs/tags/v*"], exclude: [] } },
              bypass_actors: [ { actor_id: 5, actor_type: "RepositoryRole", bypass_mode: "always" } ],
              rules: [ { type: "deletion" }, { type: "non_fast_forward" }, { type: "update" }, { type: "creation" } ] }'
          }

          case "$TASK" in
            show-plan)
              say "Existing rulesets:"
              api "repos/$REPO/rulesets" --jq '.[] | "- \(.name) (\(.target), \(.enforcement))"' | tee -a "$GITHUB_STEP_SUMMARY"
              say "Branches:"
              api --paginate "repos/$REPO/branches" --jq '.[] | "- \(.name)"' | tee -a "$GITHUB_STEP_SUMMARY"
              say "Required checks that protect-main would use: $REQUIRED_CHECKS"
              payload=$(main_payload)
              say "What protect-main would change in the live ruleset:"
              compare_ruleset "Protect main" "$payload"
              payload=$(tags_payload)
              say "What protect-release-tags would change in the live ruleset:"
              compare_ruleset "Protect release tags" "$payload"
              ;;
            protect-main)
              payload=$(main_payload)  # an assignment, so a failure here stops the script before any update
              upsert_ruleset "Protect main" "$payload"
              ;;
            protect-release-tags)
              payload=$(tags_payload)
              upsert_ruleset "Protect release tags" "$payload"
              ;;
            delete-merged-branches)
              owner="${REPO%%/*}"
              api --paginate "repos/$REPO/branches" --jq '.[].name' | while read -r b; do
                if [ "$b" = "$DEFAULT_BRANCH" ]; then continue; fi
                if echo "$b" | grep -Eq "$KEEP_REGEX"; then say "keep   $b (protected name)"; continue; fi
                open_prs=$(api "repos/$REPO/pulls?state=open&head=$owner:$b" --jq 'length')
                if [ "$open_prs" != "0" ]; then say "keep   $b (has an open pull request)"; continue; fi
                ahead=$(api "repos/$REPO/compare/$DEFAULT_BRANCH...$b" --jq '.ahead_by')
                if [ "$ahead" != "0" ]; then say "keep   $b ($ahead commit(s) not on $DEFAULT_BRANCH)"; continue; fi
                if [ "$APPLY" = "true" ]; then
                  api -X DELETE "repos/$REPO/git/refs/heads/$b" > /dev/null
                  say "DELETED $b (every commit is already on $DEFAULT_BRANCH)"
                else
                  say "would delete $b (every commit is already on $DEFAULT_BRANCH)"
                fi
              done
              ;;
            board-fields|board-fill)
              say "The board task has its own step below; nothing to do here."
              ;;
            *)
              say "Unknown task: $TASK"
              exit 1
              ;;
          esac

      - name: Create the board fields (tries the App first, then the board token)
        if: ${{ inputs.task == 'board-fields' }}
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          APPLY: ${{ inputs.apply }}
          BOARD_OWNER: saulpatinojr
          BOARD_NUMBER: "7"
        run: |
          set -euo pipefail
          say() { echo "$*" | tee -a "$GITHUB_STEP_SUMMARY"; }
          gql() { curl -sS -X POST https://api.github.com/graphql -H "Authorization: Bearer $1" -H "Content-Type: application/json" -d "$2"; }
          say "## board-fields on $BOARD_OWNER project $BOARD_NUMBER ($([ "$APPLY" = "true" ] && echo APPLY || echo DRY RUN))"

          # shellcheck disable=SC2016  # GraphQL text: $login and $n are GraphQL variables, not shell expansions
          query='query($login:String!,$n:Int!){ user(login:$login){ projectV2(number:$n){ id title fields(first:100){ nodes{ ... on ProjectV2FieldCommon { name } } } } } }'
          body=$(jq -n --arg q "$query" --arg l "$BOARD_OWNER" --argjson n "$BOARD_NUMBER" '{query:$q,variables:{login:$l,n:$n}}')

          token=""; resp=""
          # The App can read a user-owned board but cannot change it, so the board token goes first.
          for which in PROJECT_TOKEN APP_TOKEN; do
            candidate="${!which:-}"
            if [ -z "$candidate" ]; then say "Skipping $which (not set)."; continue; fi
            resp=$(gql "$candidate" "$body" || true)
            if echo "$resp" | jq -e '.data.user.projectV2.id' > /dev/null 2>&1; then
              token="$candidate"; say "The board is reachable with $which."; break
            fi
            say "$which cannot see the board: $(echo "$resp" | jq -r '.errors[0].message // "no access"' 2>/dev/null || echo unknown)"
          done
          if [ -z "$token" ]; then
            say "Neither token can reach the board. Add a classic token with only the 'project' permission as the secret PROJECT_TOKEN in the admin-ops environment, then run this again."
            exit 1
          fi

          project_id=$(echo "$resp" | jq -r '.data.user.projectV2.id')
          existing=$(echo "$resp" | jq -r '.data.user.projectV2.fields.nodes[].name')
          fields='[
            {"name":"Product","type":"SINGLE_SELECT","options":["HCW NetworkEyes","Cloud Crawler","Cloud Assessor","Azure Migration Orchestrator","Portfolio"]},
            {"name":"Workstream","type":"SINGLE_SELECT","options":["Presentation and Documentation","Security and Dependencies","Pull Requests and CI","Testing and Validation","GitHub Pages","Governance","Release"]},
            {"name":"Priority","type":"SINGLE_SELECT","options":["P0 Critical","P1 High","P2 Medium","P3 Low"]},
            {"name":"Severity","type":"SINGLE_SELECT","options":["Critical","High","Medium","Low"]},
            {"name":"Effort","type":"SINGLE_SELECT","options":["XS","S","M","L","XL"]},
            {"name":"Validation Environment","type":"SINGLE_SELECT","options":["Local","CI","Staging","Production","Not applicable"]},
            {"name":"Owner","type":"TEXT"},
            {"name":"Blocking Reason","type":"TEXT"},
            {"name":"Evidence","type":"TEXT"},
            {"name":"Target Release","type":"TEXT"},
            {"name":"Last Reviewed","type":"DATE"}
          ]'
          # shellcheck disable=SC2016  # GraphQL text: $input is a GraphQL variable, not a shell expansion
          mutation='mutation($input: CreateProjectV2FieldInput!){ createProjectV2Field(input:$input){ projectV2Field{ ... on ProjectV2SingleSelectField { id name } ... on ProjectV2Field { id name } } } }'
          echo "$fields" | jq -c '.[]' | while read -r f; do
            name=$(echo "$f" | jq -r .name)
            if echo "$existing" | grep -Fxq "$name"; then say "exists  $name"; continue; fi
            if [ "$APPLY" != "true" ]; then say "would create $name ($(echo "$f" | jq -r .type))"; continue; fi
            input=$(echo "$f" | jq --arg p "$project_id" '{projectId:$p, name:.name, dataType:.type}
              + (if .type == "SINGLE_SELECT" then {singleSelectOptions:(.options | map({name:., color:"GRAY", description:""}))} else {} end)')
            out=$(gql "$token" "$(jq -n --arg q "$mutation" --argjson i "$input" '{query:$q,variables:{input:$i}}')")
            if echo "$out" | jq -e '.data.createProjectV2Field.projectV2Field.id' > /dev/null 2>&1; then say "created $name"; else say "FAILED  $name: $(echo "$out" | jq -r '.errors[0].message // "unknown error"')"; fi
          done
          say "Not handled here (do these by hand, see the board setup ticket): the Status options, the eight views, and filling values from labels."
          if grep -q '^FAILED ' "$GITHUB_STEP_SUMMARY"; then
            echo "One or more fields could not be created. See the lines above."
            exit 1
          fi

      - name: Add the tickets to the board and fill in Product, Priority, Severity and Workstream from their labels
        if: ${{ inputs.task == 'board-fill' }}
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          APPLY: ${{ inputs.apply }}
          BOARD_OWNER: saulpatinojr
          BOARD_NUMBER: "7"
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          OWNER = os.environ["BOARD_OWNER"]
          NUMBER = int(os.environ["BOARD_NUMBER"])
          APPLY = os.environ["APPLY"] == "true"
          REPOS = ["HCW-NetworkEyes_App", "HCW-CloudCrawler_App", "HCW-CloudAssessor_App", "HCW-MigrateOrchestrator_App"]
          PRODUCT = {
              "HCW-NetworkEyes_App": "HCW NetworkEyes",
              "HCW-CloudCrawler_App": "Cloud Crawler",
              "HCW-CloudAssessor_App": "Cloud Assessor",
              "HCW-MigrateOrchestrator_App": "Azure Migration Orchestrator",
          }
          PRIORITY = {"P0": "P0 Critical", "P1": "P1 High", "P2": "P2 Medium", "P3": "P3 Low"}
          SEVERITY = {"critical": "Critical", "high": "High", "medium": "Medium", "low": "Low"}
          WORKSTREAM = {
              "security": "Security and Dependencies",
              "dependencies": "Security and Dependencies",
              "ci": "Pull Requests and CI",
              "docs": "Presentation and Documentation",
              "governance": "Governance",
              "release": "Release",
              "testing": "Testing and Validation",
              "pages": "GitHub Pages",
          }


          def http(url, token, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(url, data=data, headers={
                  "Authorization": "Bearer " + token,
                  "Content-Type": "application/json",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              try:
                  with urllib.request.urlopen(req) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  return {"errors": [{"message": "HTTP %s: %s" % (error.code, error.read().decode()[:200])}]}


          def gql(token, query, variables=None):
              return http("https://api.github.com/graphql", token, {"query": query, "variables": variables or {}})


          def first_error(response):
              return ((response.get("errors") or [{"message": "unknown error"}])[0]).get("message", "unknown error")


          PROJECT_QUERY = (
              "query($login:String!,$n:Int!){ user(login:$login){ projectV2(number:$n){ id title "
              "fields(first:100){ nodes{ ... on ProjectV2FieldCommon { id name } "
              "... on ProjectV2SingleSelectField { id name options { id name } } } } } } }"
          )
          token = None
          project = None
          for name in ("PROJECT_TOKEN", "APP_TOKEN"):
              candidate = os.environ.get(name, "")
              if not candidate:
                  print("Skipping %s (not set)." % name)
                  continue
              result = gql(candidate, PROJECT_QUERY, {"login": OWNER, "n": NUMBER})
              found = ((result.get("data") or {}).get("user") or {}).get("projectV2")
              if found:
                  token, project = candidate, found
                  print("The board is reachable with %s." % name)
                  break
              print("%s cannot see the board: %s" % (name, first_error(result)))
          if not project:
              print("Neither token can reach the board.")
              sys.exit(1)

          fields = {f["name"]: f for f in project["fields"]["nodes"] if f and f.get("name")}


          def option_id(field, option):
              for o in fields.get(field, {}).get("options", []):
                  if o["name"] == option:
                      return o["id"]
              return None


          ITEMS_QUERY = (
              "query($id:ID!,$after:String){ node(id:$id){ ... on ProjectV2{ items(first:100, after:$after){ "
              "pageInfo{ hasNextPage endCursor } nodes{ id content{ ... on Issue { id } ... on PullRequest { id } } } } } } }"
          )
          on_board = {}
          after = None
          while True:
              result = gql(token, ITEMS_QUERY, {"id": project["id"], "after": after})
              items = (((result.get("data") or {}).get("node") or {}).get("items"))
              if not items:
                  print("Could not read the board items: %s" % first_error(result))
                  sys.exit(1)
              for node in items["nodes"]:
                  content = node.get("content") or {}
                  if content.get("id"):
                      on_board[content["id"]] = node["id"]
              if not items["pageInfo"]["hasNextPage"]:
                  break
              after = items["pageInfo"]["endCursor"]

          issues = []
          for repo in REPOS:
              page = 1
              while True:
                  listing = http("https://api.github.com/repos/%s/%s/issues?state=all&per_page=100&page=%d" % (OWNER, repo, page), token)
                  if not isinstance(listing, list):
                      print("Could not list the issues of %s: %s" % (repo, first_error(listing)))
                      sys.exit(1)
                  issues += [(repo, i) for i in listing if "pull_request" not in i]
                  if len(listing) < 100:
                      break
                  page += 1
          print("Board items now: %d. Issues found in the four repositories: %d." % (len(on_board), len(issues)))


          def wanted(repo, issue):
              labels = [label["name"] for label in issue["labels"]]
              want = {"Product": PRODUCT[repo]}
              if "product:portfolio" in labels:
                  want["Product"] = "Portfolio"
              for label in labels:
                  if label in PRIORITY:
                      want["Priority"] = PRIORITY[label]
                  if label.startswith("severity:") and label[9:] in SEVERITY:
                      want["Severity"] = SEVERITY[label[9:]]
                  if label.startswith("workstream:") and label[11:] in WORKSTREAM:
                      want["Workstream"] = WORKSTREAM[label[11:]]
              return want


          ADD = "mutation($p:ID!,$c:ID!){ addProjectV2ItemById(input:{projectId:$p, contentId:$c}){ item{ id } } }"
          added = 0
          updated = 0
          problems = 0
          for repo, issue in issues:
              label = "%s#%d" % (repo, issue["number"])
              want = wanted(repo, issue)
              item = on_board.get(issue["node_id"])
              if not APPLY:
                  print("would %s %s -> %s" % ("set fields on" if item else "add and set fields on", label, want))
                  continue
              if not item:
                  result = gql(token, ADD, {"p": project["id"], "c": issue["node_id"]})
                  item = (((result.get("data") or {}).get("addProjectV2ItemById") or {}).get("item") or {}).get("id")
                  if not item:
                      print("FAILED  add %s: %s" % (label, first_error(result)))
                      problems += 1
                      continue
                  added += 1
              variables = {"p": project["id"], "i": item}
              parts = []
              declarations = ["$p:ID!", "$i:ID!"]
              for k, (field_name, option_name) in enumerate(want.items()):
                  field_id = fields.get(field_name, {}).get("id")
                  opt_id = option_id(field_name, option_name)
                  if not field_id or not opt_id:
                      print("FAILED  %s: no option '%s' in field '%s'" % (label, option_name, field_name))
                      problems += 1
                      continue
                  variables["f%d" % k] = field_id
                  variables["o%d" % k] = opt_id
                  declarations += ["$f%d:ID!" % k, "$o%d:String!" % k]
                  parts.append(
                      "m%d: updateProjectV2ItemFieldValue(input:{projectId:$p, itemId:$i, fieldId:$f%d, "
                      "value:{singleSelectOptionId:$o%d}}){ clientMutationId }" % (k, k, k)
                  )
              if parts:
                  result = gql(token, "mutation(%s){ %s }" % (",".join(declarations), " ".join(parts)), variables)
                  if result.get("errors"):
                      print("FAILED  set fields on %s: %s" % (label, first_error(result)))
                      problems += 1
                  else:
                      updated += 1
          if APPLY:
              print("Added %d issues to the board and set fields on %d. Problems: %d." % (added, updated, problems))
          else:
              print("Dry run only: nothing was changed.")
          print("Not handled here (by hand): the Status options and the eight views.")
          if problems:
              sys.exit(1)
          PY
