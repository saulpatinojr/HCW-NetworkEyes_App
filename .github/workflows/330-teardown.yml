name: "330 · Teardown Azure Platform"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to destroy"
        required: true
        type: choice
        options:
          - dev
          - prod
      confirm:
        description: "Type DESTROY to confirm — this deletes ALL resources in the target environment"
        required: true
        type: string
      destroy_tfstate_backend:
        description: "Also destroy the configured Terraform state backend RG — only for full reset"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      delete_drifted_resources:
        description: "Delete drifted AI resources after preview; leave false to review preview output first"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      region_short:
        description: "Short Azure region code used in CNA resource names; defaults to AZURE_REGION_SHORT variable"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: true
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}

concurrency:
  group: deploy-azure-platform-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  # ── Safety gate ──────────────────────────────────────────────────────────────
  preflight:
    name: Preflight safety check
    runs-on: self-hosted
    steps:
      - name: Validate confirmation string
        run: |
          if [[ "${{ github.event.inputs.confirm }}" != "DESTROY" ]]; then
            echo "::error::Confirmation string must be exactly 'DESTROY'. Got: '${{ github.event.inputs.confirm }}'"
            exit 1
          fi
          echo "Confirmation accepted. Proceeding with teardown of ${{ github.event.inputs.environment }}."

      - name: Block prod teardown on non-default branch
        if: github.event.inputs.environment == 'prod'
        run: |
          if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
            echo "::error::Production teardown must be triggered from the main branch."
            exit 1
          fi

  # ── Terraform destroy ────────────────────────────────────────────────────────
  terraform-destroy:
    name: "terraform destroy (${{ github.event.inputs.environment }})"
    runs-on: self-hosted
    needs: preflight
    environment: ${{ github.event.inputs.environment }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify target subscription
        run: |
          SUB_ID=$(az account show --query id -o tsv)
          SUB_NAME=$(az account show --query name -o tsv)
          EXPECTED_SUB_ID="${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          EXPECTED_SUB_NAME="${{ vars.AZURE_TARGET_SUBSCRIPTION_NAME }}"

          if [[ -n "$EXPECTED_SUB_ID" && "$EXPECTED_SUB_ID" != "none" && "$EXPECTED_SUB_ID" != "$SUB_ID" ]]; then
            echo "::error::Authenticated to subscription $SUB_ID, but AZURE_SUBSCRIPTION_ID expects $EXPECTED_SUB_ID"
            exit 1
          fi

          if [[ -n "$EXPECTED_SUB_NAME" && "$EXPECTED_SUB_NAME" != "none" && "$EXPECTED_SUB_NAME" != "$SUB_NAME" ]]; then
            echo "::error::Authenticated to subscription '$SUB_NAME', but AZURE_TARGET_SUBSCRIPTION_NAME expects '$EXPECTED_SUB_NAME'"
            exit 1
          fi

      - name: Derive workload resource group name
        id: names
        env:
          REGION_SHORT: ${{ vars.AZURE_REGION_SHORT }}
          INPUT_REGION_SHORT: ${{ github.event.inputs.region_short }}
          TFSTATE_RG: ${{ vars.TFSTATE_RESOURCE_GROUP }}
        run: |
          RS="${INPUT_REGION_SHORT:-$REGION_SHORT}"
          if [[ -n "$TFSTATE_RG" && "$TFSTATE_RG" == *-tfstate ]]; then
            WORKLOAD_RG="${TFSTATE_RG%-tfstate}"
          elif [[ -n "$RS" ]]; then
            WORKLOAD_RG="rg-cna-${{ github.event.inputs.environment }}-${RS}"
          else
            echo "::error::AZURE_REGION_SHORT is required to derive workload resource group name."
            exit 1
          fi
          echo "workload_rg=${WORKLOAD_RG}" >> "$GITHUB_OUTPUT"

      - name: Delete workload resource group (async)
        run: |
          RG="${{ steps.names.outputs.workload_rg }}"
          if ! az group show --name "$RG" --only-show-errors > /dev/null 2>&1; then
            echo "Resource group $RG does not exist — nothing to delete."
            exit 0
          fi
          echo "Deleting resource group $RG asynchronously..."
          az group delete --name "$RG" --yes --no-wait
          echo "Deletion initiated. Monitor progress in the Azure Portal or with:"
          echo "  az group show --name $RG --query properties.provisioningState -o tsv"

      - name: Clear Terraform state blobs (platform + workload)
        run: |
          # The split deploy keeps TWO state keys: <env>.terraform.tfstate
          # (platform) and <env>.workload.terraform.tfstate (workload). Both must
          # be cleared or the next deploy trips on "already exists" for resources
          # the surviving state still references.
          for KEY in \
            "${{ github.event.inputs.environment }}.terraform.tfstate" \
            "${{ github.event.inputs.environment }}.workload.terraform.tfstate"; do
            echo "Clearing state blob: $KEY"
            az storage blob delete \
              --account-name "${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
              --container-name "${{ vars.TFSTATE_CONTAINER }}" \
              --name "$KEY" \
              --auth-mode login \
              --only-show-errors || true
          done
          echo "State files cleared — next deploy starts from a blank slate."

  # ── Clean up drifted resources not in Terraform state ────────────────────────
  cleanup-drift:
    name: "Remove drifted resources (${{ github.event.inputs.environment }})"
    runs-on: self-hosted
    needs: terraform-destroy
    # Non-blocking: the StaleAi targets all live inside the workload RG, which the
    # terraform-destroy job already deletes, so this job is a best-effort sweep for
    # any out-of-RG drift. A failure here (e.g. pwsh absent, nothing to clean) must
    # not fail the teardown — the real destruction already happened upstream.
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Preview CNA cleanup targets
        env:
          INPUT_REGION_SHORT: ${{ github.event.inputs.region_short }}
          VAR_REGION_SHORT: ${{ vars.AZURE_REGION_SHORT }}
        run: |
          REGION_SHORT="${INPUT_REGION_SHORT:-$VAR_REGION_SHORT}"
          if [[ -z "$REGION_SHORT" ]]; then
            echo "::error::AZURE_REGION_SHORT is required, or pass region_short when dispatching workflow 220."
            exit 1
          fi
          pwsh -File ./scripts/cleanup-stale-ai-resources.ps1 -Environment "${{ github.event.inputs.environment }}" -RegionShort "$REGION_SHORT" -Scope StaleAi

      - name: Delete drifted resources (not managed by Terraform)
        if: github.event.inputs.delete_drifted_resources == 'true'
        env:
          INPUT_REGION_SHORT: ${{ github.event.inputs.region_short }}
          VAR_REGION_SHORT: ${{ vars.AZURE_REGION_SHORT }}
        run: |
          REGION_SHORT="${INPUT_REGION_SHORT:-$VAR_REGION_SHORT}"
          if [[ -z "$REGION_SHORT" ]]; then
            echo "::error::AZURE_REGION_SHORT is required, or pass region_short when dispatching workflow 220."
            exit 1
          fi
          pwsh -File ./scripts/cleanup-stale-ai-resources.ps1 -Environment "${{ github.event.inputs.environment }}" -RegionShort "$REGION_SHORT" -Scope StaleAi -Delete

      - name: Require explicit rerun for drift deletion
        if: github.event.inputs.delete_drifted_resources != 'true'
        run: |
          echo "Preview complete. Review the cleanup target list above."
          echo "Re-run workflow 220 with delete_drifted_resources=true only after approving the preview."

  # ── Optional: wipe TF state backend ─────────────────────────────────────────
  destroy-backend:
    name: "Destroy TF state backend RG"
    runs-on: self-hosted
    needs: cleanup-drift
    if: github.event.inputs.destroy_tfstate_backend == 'true'
    steps:
      - uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify target subscription
        run: |
          SUB_ID=$(az account show --query id -o tsv)
          SUB_NAME=$(az account show --query name -o tsv)
          EXPECTED_SUB_ID="${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          EXPECTED_SUB_NAME="${{ vars.AZURE_TARGET_SUBSCRIPTION_NAME }}"

          if [[ -n "$EXPECTED_SUB_ID" && "$EXPECTED_SUB_ID" != "none" && "$EXPECTED_SUB_ID" != "$SUB_ID" ]]; then
            echo "::error::Authenticated to subscription $SUB_ID, but AZURE_SUBSCRIPTION_ID expects $EXPECTED_SUB_ID"
            exit 1
          fi

          if [[ -n "$EXPECTED_SUB_NAME" && "$EXPECTED_SUB_NAME" != "none" && "$EXPECTED_SUB_NAME" != "$SUB_NAME" ]]; then
            echo "::error::Authenticated to subscription '$SUB_NAME', but AZURE_TARGET_SUBSCRIPTION_NAME expects '$EXPECTED_SUB_NAME'"
            exit 1
          fi

      - name: Delete Terraform state backend resources
        run: |
          echo "WARNING: Deleting Terraform state backend RG. All state will be permanently lost."
          TF_STATE_RG="${{ vars.TFSTATE_RESOURCE_GROUP }}"

          az storage account delete \
            --name "${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            --resource-group "${TF_STATE_RG}" \
            --yes || true

          az group delete \
            --name "${TF_STATE_RG}" \
            --yes --no-wait || true

          echo "State backend RG deletion initiated (--no-wait). Run 000-bootstrap-backend to recreate."
