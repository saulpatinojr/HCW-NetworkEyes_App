name: "200 · Build Container Images"

# Runs on GitHub-hosted runners (ubuntu-latest). Nothing here needs a private
# network, a cloud credential or a stored token: images build with buildx (GitHub Actions cache) and
# push to Docker Hub through its OIDC connection. This workflow is the only publisher of the images and
# calls nothing outside this repository and its own Docker Hub repository. The self-hosted runner the original
# repository used is retired; a fresh clone of this repository needs no runner.
#
# First build in a new repository (REVIEW.md R-013 step 4): GitHub registers a
# workflow only once a push to main touches it, so the import merge alone did
# not make this one dispatchable. The commit that adds this paragraph is that
# push; its own run is the first build from this repository.
#
# Publish order (scan before tag). Every image is pushed to Docker Hub **by
# digest only** (no tag), scanned by Docker Scout at that digest, and only when
# all five images have passed does the `tag-images` job attach the immutable
# `*-sha-<7>` and floating `*-latest` tags. A failed scan therefore never moves
# a tag; the untagged digest it leaves behind is inert (no tag resolves to it;
# whether and when Docker Hub deletes such a manifest was not checked against its
# documentation, so it may stay until removed by hand). The record of a build is the digest table
# `tag-images` writes to the run's step summary (one row per component: tags, digest, signed yes/no); the
# 310 release notes repeat the digests. Nothing is written back to the repository.
#
# Tagging is NOT atomic and a re-run is the recovery. `tag-images` verifies all five digests, writes the table
# (heading: "Verified; tagging in progress"), then moves the tags one component at a time. If it fails or is
# cancelled part-way, some components carry the new tags and some still the old ones, and the summary shows the
# table without the closing "All five components tagged" line. Recovery: re-run the failed `tag-images` job
# (Actions, Re-run failed jobs; the build jobs and their outputs are kept). It verifies every digest again and then
# repeats `imagetools create`, which gives a tag the digest it already has without error, so nothing is duplicated.
# Do not re-run the whole workflow for this: that rebuilds everything under a new run id.
#
# Signing (TODO.md T-703). Once an image has passed its gates, the build job
# signs the digest with cosign — keyless, under this workflow's OIDC identity
# (`id-token: write`, nothing stored in the repository) — and attaches BuildKit's
# SLSA provenance as a cosign attestation (scripts/ci/sign_image.sh). A consumer
# should refuse to deploy a digest that does not verify against this
# workflow's identity, so a tag re-pointed on Docker Hub, or an image pushed with
# the registry credential from anywhere else, cannot be rolled out.

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .dockerignore
      - apps/cna-api/**
      - apps/cna-worker/**
      - apps/cna-web/**
      - cna/**
      - scripts/drawio-headless.sh
      - scripts/ci/sign_image.sh
      - pyproject.toml
      - uv.lock  # every Python image installs from it (TODO.md T-702)
      - .github/workflows/200-build-images.yml
  workflow_dispatch:
    inputs:
      rehearsal:
        description: >-
          Rehearse without publishing, before DOCKERHUB_ENABLED is switched on. One job runs:
          the Docker Hub login (proves the OIDC connection's ruleset and its Image Push scope by
          pushing an empty labelled image BY DIGEST ONLY, main branch only, then has Docker
          Scout analyse it with the same call the real build uses). No product image is built
          and nothing is tagged or signed.
        type: boolean
        default: false

# Never cancel an in-flight build. Tagging in the final `tag-images` job is not
# atomic (the check that nothing moves unless all five digests verify happens before
# the first tag, but the tags then move one component at a time), so a cancellation while that
# job is mid-loop would leave a partial tagged set on Docker Hub (e.g. `api-latest` moved,
# `web-latest` not) that a consumer following the `*-latest` tags would deploy. See "Tagging is NOT
# atomic" above for the recovery.
# Queued runs for the same ref still collapse to the newest one, so a burst of
# Dependabot merges costs at most one superseded full build, and runs finish in
# push order (the queued run starts only after the in-flight one completes), so
# `*-latest` can never move backwards.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # The Docker Hub repository every image of this repository is published to, under
  # `docker.io/<DOCKERHUB_NAMESPACE>/`. The single place the name is written in this workflow: every
  # job, every step and `scripts/ci/sign_image.sh` read it from here. The name follows the owner's
  # convention `img-<short name>-<job>-<type>` (tests/security/test_image_repository_name.py
  # enforces the shape and that no workflow, script or contract names another repository).
  # Never reuse the retired `cna` repository: it belongs to a different image. Only the repository
  # changes the name; the tag scheme inside it (`sha-<7>`, `latest`, `<role>-sha-<7>`,
  # `<role>-latest`) is part of the published contract (CLAUDE.md) and stays as it is.
  IMAGE_REPOSITORY: img-ne-appliance-app
  # cosign release that signs every image and verifies it in `tag-images`. 310 verifies with the same
  # release (COSIGN_VERSION there). Bump the two together.
  COSIGN_VERSION: v3.1.3

# No workflow-wide grants: each job declares the least it needs below. The build
# jobs run third-party actions and must not hold a write token. `id-token:
# write` lets cosign request a certificate for this run's identity; it grants
# nothing in this repository, but every action in those two jobs could mint an
# OIDC token as this workflow — keep their list short and SHA-pinned.
permissions: {}

jobs:
  # CLI, API, and Worker share an identical build shape (multi-stage image built
  # from the repository root context, no extra validation) so they run as one
  # matrix. Web is separate below because it adds npm audit, a second
  # (migrator) target, and a smoke test.
  #
  # Each matrix leg publishes its digest and tag list under its own output key
  # (`cli`, `api`, `worker`); a leg leaves the other keys unset, so the job-level
  # outputs below carry one value per image. `tag-images` re-validates every
  # digest before it touches a tag.
  build-images:
    runs-on: ubuntu-latest
    # Pushing needs the Docker Hub OIDC connection; the variable is the owner's switch.
    if: vars.DOCKERHUB_ENABLED == 'true' && !inputs.rehearsal && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
    outputs:
      digest_cli: ${{ steps.digest.outputs.cli }}
      digest_api: ${{ steps.digest.outputs.api }}
      digest_worker: ${{ steps.digest.outputs.worker }}
      tags_cli: ${{ steps.digest.outputs.tags_cli }}
      tags_api: ${{ steps.digest.outputs.tags_api }}
      tags_worker: ${{ steps.digest.outputs.tags_worker }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CLI
            key: cli
            file: Dockerfile
            raw_tag: latest
            sha_prefix: ""
          - name: API
            key: api
            file: apps/cna-api/Dockerfile
            raw_tag: api-latest
            sha_prefix: api-sha-
          - name: Worker
            key: worker
            file: apps/cna-worker/Dockerfile
            raw_tag: worker-latest
            sha_prefix: worker-sha-
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Validate Docker Hub namespace
        run: |
          if [ -z "$DOCKERHUB_NAMESPACE" ]; then
            echo "::error::DOCKERHUB_NAMESPACE variable is required."
            exit 1
          fi

      - name: Log in to Docker Hub
        # Docker Hub's OIDC connection (REFACTOR_APP.md change set J): the action
        # exchanges this job's id-token for a short-lived registry credential, so no
        # long-lived access token is stored. [VERIFY] the env variable names and the
        # minimum login-action version against the Docker Hub OIDC documentation.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_CONNECTION }}
          # One hour, not the 15 minutes this job used to ask for: the token is minted here and used
          # for the last push (and the cosign signature) only after the npm audit, the image builds and
          # the Docker Scout scans, which together outlast 900 s. docker/login-action allows 300-3600.
          DOCKERHUB_OIDC_EXPIREIN: '3600'
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_NAMESPACE }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      # The tag list computed here is NOT applied by the build step below; it is
      # handed to `tag-images`, which applies it only after every image has
      # passed its scan. The labels are baked into the image now.
      - name: Extract metadata for ${{ matrix.name }}
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: docker.io/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_REPOSITORY }}
          tags: |
            type=raw,value=${{ matrix.raw_tag }}
            type=sha,prefix=${{ matrix.sha_prefix }}

      # Push by digest only (`push-by-digest=true`, no `tags:`): the image lands
      # on Docker Hub addressable solely as `<repository>@sha256:…` until `tag-images`
      # tags it. Provenance and SBOM attestations are attached to that digest.
      - name: Build and push ${{ matrix.name }} image by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: |
            CNA_BUILD_SHA=${{ github.sha }}
          outputs: type=image,name=docker.io/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_REPOSITORY }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scout by digest, not by a mutable tag: no tag exists yet for this build,
      # and buildx --push never loads the image into the runner's local Docker
      # daemon, so docker/scout-action could otherwise silently fall back to a
      # stale locally-cached image and scan the wrong content entirely.
      - name: Docker Scout — fail on fixable critical/high CVEs
        uses: docker/scout-action@a4119c5a8c5076236a54e4ce99531f7e4dd2ef84  # v1.27.0
        with:
          command: cves
          image: docker.io/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_REPOSITORY }}@${{ steps.build.outputs.digest }}
          only-severities: critical,high
          only-fixed: true
          exit-code: true

      # Sign only what Scout accepted, and only by digest: the signature is what
      # consumers verify before a deploy (scripts/ci/sign_image.sh).
      - name: Sign and attest ${{ matrix.name }} image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: scripts/ci/sign_image.sh "docker.io/${DOCKERHUB_NAMESPACE}/${IMAGE_REPOSITORY}@${DIGEST}"

      - name: Record ${{ matrix.name }} digest and tag list for tag-images
        id: digest
        env:
          KEY: ${{ matrix.key }}
          DIGEST: ${{ steps.build.outputs.digest }}
          META_JSON: ${{ steps.meta.outputs.json }}
        run: |
          set -euo pipefail
          if ! [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Build step returned no valid digest for ${KEY} (got '${DIGEST}')."
            exit 1
          fi
          TAGS_JSON=$(jq -c '.tags' <<< "$META_JSON")
          if [ "$(jq 'length' <<< "$TAGS_JSON")" -lt 1 ]; then
            echo "::error::metadata-action produced no tags for ${KEY}."
            exit 1
          fi
          echo "${KEY}=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "tags_${KEY}=${TAGS_JSON}" >> "$GITHUB_OUTPUT"
          echo "${KEY}: ${DIGEST} -> ${TAGS_JSON}"

  build-web:
    runs-on: ubuntu-latest
    # Pushing needs the Docker Hub OIDC connection; the variable is the owner's switch.
    if: vars.DOCKERHUB_ENABLED == 'true' && !inputs.rehearsal && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
    outputs:
      digest_web: ${{ steps.digest.outputs.web }}
      digest_migrator: ${{ steps.digest.outputs.migrator }}
      tags_web: ${{ steps.digest.outputs.tags_web }}
      tags_migrator: ${{ steps.digest.outputs.tags_migrator }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Validate Docker Hub namespace
        run: |
          if [ -z "$DOCKERHUB_NAMESPACE" ]; then
            echo "::error::DOCKERHUB_NAMESPACE variable is required."
            exit 1
          fi

      - name: Log in to Docker Hub
        # Docker Hub's OIDC connection (REFACTOR_APP.md change set J): the action
        # exchanges this job's id-token for a short-lived registry credential, so no
        # long-lived access token is stored. [VERIFY] the env variable names and the
        # minimum login-action version against the Docker Hub OIDC documentation.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_CONNECTION }}
          # One hour, not the 15 minutes this job used to ask for: the token is minted here and used
          # for the last push (and the cosign signature) only after the npm audit, the image builds and
          # the Docker Scout scans, which together outlast 900 s. docker/login-action allows 300-3600.
          DOCKERHUB_OIDC_EXPIREIN: '3600'
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_NAMESPACE }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      # Tag lists here are handed to `tag-images` and applied only after every
      # image has passed its scan (see the CLI/API/Worker job above).
      - name: Extract metadata for Web
        id: meta_web
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: docker.io/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_REPOSITORY }}
          tags: |
            type=raw,value=web-latest
            type=sha,prefix=web-sha-

      - name: Extract metadata for Migrator
        id: meta_migrator
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: docker.io/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_REPOSITORY }}
          tags: |
            type=raw,value=migrator-latest
            type=sha,prefix=migrator-sha-

      - name: npm audit — check for known vulnerabilities
        # Fail on critical/high vulnerabilities before building the image.
        # Audit-level=high: moderate issues are warned, not failing (acceptable for beta deps).
        # Run from apps/cna-web since package-lock.json is scoped to that directory.
        run: |
          cd apps/cna-web
          npm audit --audit-level=high --omit=dev 2>&1 || {
            echo "::warning::npm audit found issues — review above output"
            echo "::warning::Run 'npm audit fix' locally if issues are exploitable in production context"
            # Fail only on critical issues (exit code 16 = critical)
            npm audit --audit-level=critical --omit=dev
          }

      - name: Build and push Web image by digest
        id: build_web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: apps/cna-web
          file: apps/cna-web/Dockerfile
          target: runner
          build-args: |
            CNA_BUILD_SHA=${{ github.sha }}
          outputs: type=image,name=docker.io/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_REPOSITORY }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta_web.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scout by digest — see the comment on the CLI/API/Worker Scout step
      # above: no tag exists yet, and a floating-tag reference could resolve
      # against a stale locally-cached image instead of the one just pushed.
      - name: Docker Scout — fail on fixable critical/high CVEs (Web)
        uses: docker/scout-action@a4119c5a8c5076236a54e4ce99531f7e4dd2ef84  # v1.27.0
        with:
          command: cves
          image: docker.io/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_REPOSITORY }}@${{ steps.build_web.outputs.digest }}
          only-severities: critical,high
          only-fixed: true
          exit-code: true

      - name: Build and push Migrator image by digest
        id: build_migrator
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: apps/cna-web
          file: apps/cna-web/Dockerfile
          target: migrator
          build-args: |
            CNA_BUILD_SHA=${{ github.sha }}
          outputs: type=image,name=docker.io/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_REPOSITORY }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta_migrator.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha

      - name: Docker Scout — fail on fixable critical/high CVEs (Migrator)
        uses: docker/scout-action@a4119c5a8c5076236a54e4ce99531f7e4dd2ef84  # v1.27.0
        with:
          command: cves
          image: docker.io/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_REPOSITORY }}@${{ steps.build_migrator.outputs.digest }}
          only-severities: critical,high
          only-fixed: true
          exit-code: true

      - name: Smoke test — /api/health returns 200
        env:
          WEB_DIGEST: ${{ steps.build_web.outputs.digest }}
        run: |
          # Run by digest: it is the only reference that exists for this build
          # yet, and `docker run` would otherwise prefer a stale locally-cached
          # image over pulling the one just pushed (same issue as the Docker
          # Scout steps above), which would smoke-test the wrong image entirely.
          docker run -d --name cna-web-smoke \
            -e DATABASE_URL="postgresql://test:test@localhost:5432/test?sslmode=disable" \
            -e NEXTAUTH_URL="http://localhost:3000" \
            -e NEXTAUTH_SECRET="ci-smoke-secret-not-real" \
            -e AZURE_AD_CLIENT_ID="00000000-0000-0000-0000-000000000000" \
            -e AZURE_AD_CLIENT_SECRET="ci-placeholder" \
            -e AZURE_AD_TENANT_ID="00000000-0000-0000-0000-000000000000" \
            -p 3000:3000 \
            "docker.io/${DOCKERHUB_NAMESPACE}/${IMAGE_REPOSITORY}@${WEB_DIGEST}"
          sleep 15
          # Always dump logs so we can diagnose crashes even on failure
          echo "--- container status ---"
          docker ps -a --filter name=cna-web-smoke --format "table {{.Status}}\t{{.Ports}}"
          echo "--- container logs ---"
          docker logs cna-web-smoke || true
          echo "--- end logs ---"
          # Health check returns 503 without a real DB — verify the process started
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health || true)
          docker rm -f cna-web-smoke
          # 200 = healthy DB, 503 = process started but DB unreachable (expected in CI)
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "503" ]; then
            echo "Unexpected status: $STATUS — container may have failed to start"
            exit 1
          fi
          echo "Smoke test passed (status=$STATUS)"

      # Both digests have now passed Scout and web its smoke test; sign them by
      # digest (scripts/ci/sign_image.sh) — same gate as the CLI/API/Worker job.
      - name: Sign and attest Web and Migrator images
        env:
          DIGEST_WEB: ${{ steps.build_web.outputs.digest }}
          DIGEST_MIGRATOR: ${{ steps.build_migrator.outputs.digest }}
        run: |
          set -euo pipefail
          scripts/ci/sign_image.sh "docker.io/${DOCKERHUB_NAMESPACE}/${IMAGE_REPOSITORY}@${DIGEST_WEB}"
          scripts/ci/sign_image.sh "docker.io/${DOCKERHUB_NAMESPACE}/${IMAGE_REPOSITORY}@${DIGEST_MIGRATOR}"

      - name: Record Web and Migrator digests and tag lists for tag-images
        id: digest
        env:
          DIGEST_WEB: ${{ steps.build_web.outputs.digest }}
          DIGEST_MIGRATOR: ${{ steps.build_migrator.outputs.digest }}
          META_WEB_JSON: ${{ steps.meta_web.outputs.json }}
          META_MIGRATOR_JSON: ${{ steps.meta_migrator.outputs.json }}
        run: |
          set -euo pipefail
          record() {
            local key="$1" digest="$2" meta_json="$3" tags_json
            if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Build step returned no valid digest for ${key} (got '${digest}')."
              exit 1
            fi
            tags_json=$(jq -c '.tags' <<< "$meta_json")
            if [ "$(jq 'length' <<< "$tags_json")" -lt 1 ]; then
              echo "::error::metadata-action produced no tags for ${key}."
              exit 1
            fi
            echo "${key}=${digest}" >> "$GITHUB_OUTPUT"
            echo "tags_${key}=${tags_json}" >> "$GITHUB_OUTPUT"
            echo "${key}: ${digest} -> ${tags_json}"
          }
          record web      "$DIGEST_WEB"      "$META_WEB_JSON"
          record migrator "$DIGEST_MIGRATOR" "$META_MIGRATOR_JSON"

  # The only place a tag is created. Runs only when every image has been built,
  # scanned and (web) smoke-tested, then attaches each image's `*-sha-<7>` and
  # `*-latest` tags to the digest that was scanned — the tag can never point at
  # content Scout did not see. `imagetools create` re-tags the pushed index
  # (with its attestations) without rebuilding or re-pushing layers.
  #
  # Before any tag moves, scripts/ci/verify_signed_digest.sh checks that each of the five digests is signed and
  # attested by THIS workflow at THIS commit and run, so no tag is ever attached to a digest a consumer could not
  # verify. The job then writes one row per component (tags, digest, signed yes/no) to the run's step summary. That
  # table is the record of what this build published; nothing is committed to the repository, and the release
  # notes of 310 repeat the digests. If any digest does not verify, the table says `no` for it and the job stops
  # before it tags anything.
  tag-images:
    runs-on: ubuntu-latest
    # Main only, like the rehearsal: the OIDC connection's ruleset and the signing identity both name refs/heads/main.
    if: vars.DOCKERHUB_ENABLED == 'true' && !inputs.rehearsal && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) # owner step: Docker Hub OIDC connection + variables (REFACTOR_APP.md change set J)
    timeout-minutes: 15
    needs: [build-images, build-web]
    permissions:
      contents: read
      id-token: write  # the Docker Hub OIDC login below exchanges this job's GitHub token
    env:
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
    steps:
      # The verification script lives in the repository, at the commit that was built.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Validate Docker Hub namespace
        run: |
          if [ -z "$DOCKERHUB_NAMESPACE" ]; then
            echo "::error::DOCKERHUB_NAMESPACE variable is required."
            exit 1
          fi

      - name: Log in to Docker Hub
        # Docker Hub's OIDC connection (REFACTOR_APP.md change set J): the action
        # exchanges this job's id-token for a short-lived registry credential, so no
        # long-lived access token is stored. [VERIFY] the env variable names and the
        # minimum login-action version against the Docker Hub OIDC documentation.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_CONNECTION }}
          # The longest the connection allows: five verifications (cosign talks to Sigstore, up to two
          # attempts each) run before the first tag moves, and the token is first used by the tagging.
          DOCKERHUB_OIDC_EXPIREIN: '3600'
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_NAMESPACE }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Verify, tag and record every scanned digest
        env:
          DIGEST_CLI: ${{ needs.build-images.outputs.digest_cli }}
          DIGEST_API: ${{ needs.build-images.outputs.digest_api }}
          DIGEST_WORKER: ${{ needs.build-images.outputs.digest_worker }}
          DIGEST_WEB: ${{ needs.build-web.outputs.digest_web }}
          DIGEST_MIGRATOR: ${{ needs.build-web.outputs.digest_migrator }}
          TAGS_CLI: ${{ needs.build-images.outputs.tags_cli }}
          TAGS_API: ${{ needs.build-images.outputs.tags_api }}
          TAGS_WORKER: ${{ needs.build-images.outputs.tags_worker }}
          TAGS_WEB: ${{ needs.build-web.outputs.tags_web }}
          TAGS_MIGRATOR: ${{ needs.build-web.outputs.tags_migrator }}
          # What verify_signed_digest.sh pins every digest to: this commit (the image's revision label) and this run
          # (the builder of its provenance).
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_RUN_IDS: ${{ github.run_id }}
        run: |
          set -euo pipefail
          IMAGE="docker.io/${DOCKERHUB_NAMESPACE}/${IMAGE_REPOSITORY}"
          declare -A DIGESTS=(
            [cli]="$DIGEST_CLI" [api]="$DIGEST_API" [worker]="$DIGEST_WORKER"
            [web]="$DIGEST_WEB" [migrator]="$DIGEST_MIGRATOR"
          )
          declare -A TAGS=(
            [cli]="$TAGS_CLI" [api]="$TAGS_API" [worker]="$TAGS_WORKER"
            [web]="$TAGS_WEB" [migrator]="$TAGS_MIGRATOR"
          )
          COMPONENTS="cli api worker web migrator"

          # Validate everything first so a missing output fails before any tag moves.
          for c in $COMPONENTS; do
            if ! [[ "${DIGESTS[$c]}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::No valid digest for '${c}' (got '${DIGESTS[$c]}'); refusing to tag anything."
              exit 1
            fi
            if [ -z "${TAGS[$c]}" ] || [ "$(jq 'length' <<< "${TAGS[$c]}")" -lt 1 ]; then
              echo "::error::No tag list for '${c}'; refusing to tag anything."
              exit 1
            fi
          done

          # The digest table of this build, in the run's step summary. $1 is the heading.
          write_table() {
            {
              echo "### $1"
              echo ""
              echo "Repository \`${IMAGE}\`, commit \`${GITHUB_SHA}\`, run ${GITHUB_RUN_ID}."
              echo ""
              echo "| Component | Tags | Digest | Signed |"
              echo "| --- | --- | --- | --- |"
              for c in $COMPONENTS; do
                TAG_LIST=$(jq -r --arg prefix "${IMAGE}:" '[.[] | ltrimstr($prefix) | "`" + . + "`"] | join(", ")' <<< "${TAGS[$c]}")
                echo "| ${c} | ${TAG_LIST} | \`${DIGESTS[$c]}\` | ${SIGNED[$c]} |"
              done
              echo ""
              echo "Pull by digest, never by a floating tag, and verify the signature before running an image (README, Verifying images)."
            } >> "$GITHUB_STEP_SUMMARY"
          }

          # Verify every digest before any tag moves. A digest that does not verify is reported as `no` and
          # stops the job, so a tag is never attached to a digest a consumer could not verify.
          declare -A SIGNED=()
          UNSIGNED=0
          for c in $COMPONENTS; do
            if bash scripts/ci/verify_signed_digest.sh "${IMAGE}@${DIGESTS[$c]}"; then
              SIGNED[$c]=yes
            else
              SIGNED[$c]=no
              UNSIGNED=$((UNSIGNED + 1))
            fi
          done
          if [ "$UNSIGNED" -gt 0 ]; then
            write_table "NOT TAGGED: ${UNSIGNED} of 5 digests did not verify"
            echo "::error::${UNSIGNED} digest(s) are not signed and attested by this workflow at this commit (the table in the step summary names them); refusing to tag anything."
            exit 1
          fi

          # The record is written BEFORE the first tag moves, so a failure part-way through the loop still
          # leaves it. Without the closing line below, tagging did not finish: re-run this job.
          write_table "Verified; tagging in progress (no 'All five components tagged' line below means it stopped part-way: re-run this job)"

          for c in $COMPONENTS; do
            ARGS=()
            while IFS= read -r t; do
              [ -n "$t" ] && ARGS+=(-t "$t")
            done < <(jq -r '.[]' <<< "${TAGS[$c]}")
            echo "Tagging ${c}: ${IMAGE}@${DIGESTS[$c]} ->" "${ARGS[@]}"
            docker buildx imagetools create "${ARGS[@]}" "${IMAGE}@${DIGESTS[$c]}"
          done
          echo "### All five components tagged" >> "$GITHUB_STEP_SUMMARY"

  # Dry run of the Docker Hub OIDC connection (workflow_dispatch with `rehearsal`, main only). It does
  # not need DOCKERHUB_ENABLED, so it can prove the connection before publishing is switched on:
  #   1. the login alone proves the run's OIDC subject (`repo:…:ref:refs/heads/main`) matches the
  #      connection's ruleset;
  #   2. an image with one tiny layer (`FROM scratch`, one COPY, two labels) pushed by digest only, with
  #      no tag, proves the Image Push scope on the repository. The layer is there so a registry that
  #      rejects an image with no layers cannot be misread as a missing scope. No tag resolves to an
  #      untagged digest; whether and when Docker Hub deletes it was not checked against its
  #      documentation, so remove it by hand (Repository, Tags and images) if you want it gone;
  #   3. reading the digest back proves the image is there;
  #   4. Docker Scout analyses that digest with the same action and arguments as the real build jobs, so
  #      Scout's acceptance of the OIDC credential is rehearsed too. If Scout refuses it, the failure
  #      hint says so: the fix is a Docker Hub personal access token for Scout (the action's
  #      `dockerhub-user` / `dockerhub-password` inputs), and TODO.md T-728 records that this must be
  #      settled before DOCKERHUB_ENABLED is set;
  #   5. the digest is signed and attested by the SAME script the real jobs use (scripts/ci/sign_image.sh, with
  #      BuildKit provenance and the SBOM as in the real build), so cosign v3's OCI-referrer storage on Docker Hub
  #      and the provenance read-back are proven before the first publish;
  #   6. scripts/ci/verify_signed_digest.sh then verifies that digest exactly as tag-images and 310 do (this
  #      workflow's identity on main, GitHub's issuer, this run, this commit's revision label);
  #   7. the digest gets one throwaway tag, `rehearsal-<run id>`, and it is read back, which is what tag-images'
  #      `imagetools create` does to a signed index. That tag matches none of 370's patterns, so nothing prunes
  #      it: remove it, the untagged digest and cosign's signature/attestation artifacts by hand on Docker Hub if you
  #      do not want them. This job deletes nothing; it created only those objects.
  # What the rehearsal cannot cover: the five real images and their digest hand-over between jobs, the
  # revision label that docker/metadata-action puts on the real images (here it is set by hand), the digest
  # table and the verify-before-tag gate of tag-images, and 310. It never touches `latest` or any `*-sha-*` tag and
  # writes nothing to the repository.
  # The real build jobs above stay skipped: they need DOCKERHUB_ENABLED == 'true' and `!inputs.rehearsal`.
  rehearse-docker-login:
    runs-on: ubuntu-latest
    # Main only: the connection's ruleset names refs/heads/main only.
    if: inputs.rehearsal && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write  # the login below exchanges this job's GitHub OIDC token; cosign uses it for Fulcio
    env:
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
    steps:
      # The signing and verification scripts live in the repository.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Docker Hub namespace and connection
        env:
          CONNECTION: ${{ vars.DOCKERHUB_CONNECTION }}
        run: |
          if [ -z "$DOCKERHUB_NAMESPACE" ]; then
            echo "::error::DOCKERHUB_NAMESPACE variable is required (the Docker Hub organisation that owns the repository)."
            exit 1
          fi
          if ! [[ "$CONNECTION" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error::DOCKERHUB_CONNECTION must be the Docker Hub OIDC connection id, a UUID (got '${CONNECTION}'). Set it with: gh variable set DOCKERHUB_CONNECTION --body <connection id>."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to Docker Hub
        # Exactly as the real jobs log in (change set J of REFACTOR_APP.md): the action exchanges this
        # job's id-token for a short-lived registry credential, so no long-lived access token is stored.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_CONNECTION }}
          DOCKERHUB_OIDC_EXPIREIN: '1800'  # a 25-minute job
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_NAMESPACE }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Write the rehearsal image definition
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/rehearsal-image"
          printf 'rehearsal run %s\n' "$GITHUB_RUN_ID" > "${RUNNER_TEMP}/rehearsal-image/rehearsal.txt"
          printf 'FROM scratch\nCOPY rehearsal.txt /rehearsal.txt\nLABEL rehearsal="true" run_id="%s"\n' "$GITHUB_RUN_ID" > "${RUNNER_TEMP}/rehearsal-image/Dockerfile"
          cat "${RUNNER_TEMP}/rehearsal-image/Dockerfile"

      # Push by digest only (`push-by-digest=true`, no `tags:`), as the real build does, with BuildKit
      # provenance and the SBOM as the real build has them (sign_image.sh reads the provenance back), and the
      # revision label that verify_signed_digest.sh checks.
      - name: Push the rehearsal image by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ runner.temp }}/rehearsal-image
          outputs: type=image,name=docker.io/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_REPOSITORY }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            rehearsal=true
          provenance: true
          sbom: true

      - name: Read the pushed digest back
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          if ! [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The push returned no valid digest (got '${DIGEST}')."
            exit 1
          fi
          READ=$(docker buildx imagetools inspect "docker.io/${DOCKERHUB_NAMESPACE}/${IMAGE_REPOSITORY}@${DIGEST}" --format '{{.Manifest.Digest}}')
          if [ "$READ" != "$DIGEST" ]; then
            echo "::error::Read back ${READ}, expected ${DIGEST}."
            exit 1
          fi
          echo "Docker Hub accepted the login and the push, and returns ${DIGEST} for docker.io/${DOCKERHUB_NAMESPACE}/${IMAGE_REPOSITORY}."
          echo "The image is untagged and no tag resolves to it yet; the steps below sign it, verify it and give it one rehearsal tag."

      # The same action, version and arguments as the real build jobs use on every digest they push.
      - name: Docker Scout analyses the rehearsal digest
        id: scout
        uses: docker/scout-action@a4119c5a8c5076236a54e4ce99531f7e4dd2ef84  # v1.27.0
        with:
          command: cves
          image: docker.io/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_REPOSITORY }}@${{ steps.push.outputs.digest }}
          only-severities: critical,high
          only-fixed: true
          exit-code: true

      # The real signing path, on the throwaway digest: cosign sign and attest (keyless, this job's OIDC identity).
      - name: Sign and attest the rehearsal digest
        id: sign
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: scripts/ci/sign_image.sh "docker.io/${DOCKERHUB_NAMESPACE}/${IMAGE_REPOSITORY}@${DIGEST}"

      # The real verification, with the same expected identity, issuer, run and revision rules as tag-images and 310.
      - name: Verify the rehearsal digest as tag-images and 310 do
        id: verify
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_RUN_IDS: ${{ github.run_id }}
        run: bash scripts/ci/verify_signed_digest.sh "docker.io/${DOCKERHUB_NAMESPACE}/${IMAGE_REPOSITORY}@${DIGEST}"

      - name: Give the digest one rehearsal tag and read it back
        id: retag
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/ci/registry_digest.sh
          source scripts/ci/registry_digest.sh
          IMAGE="docker.io/${DOCKERHUB_NAMESPACE}/${IMAGE_REPOSITORY}"
          TAG="rehearsal-${GITHUB_RUN_ID}"
          docker buildx imagetools create -t "${IMAGE}:${TAG}" "${IMAGE}@${DIGEST}"
          READ="$(registry_digest "${IMAGE}:${TAG}")"
          if [ "$READ" != "$DIGEST" ]; then
            echo "::error::${IMAGE}:${TAG} resolves to ${READ}, expected ${DIGEST}."
            exit 1
          fi
          echo "${IMAGE}:${TAG} -> ${DIGEST}. Remove this tag by hand on Docker Hub if you do not want it kept: 370 never prunes it."

      - name: What to check if signing, verifying or tagging failed
        if: failure() && (steps.sign.outcome == 'failure' || steps.verify.outcome == 'failure' || steps.retag.outcome == 'failure')
        run: |
          echo "::error::The login and the push worked, but the signing, verification or tagging of the rehearsal digest failed. The real jobs would fail the same way, so settle it BEFORE DOCKERHUB_ENABLED is set."
          echo "::error::sign: cosign v3 stores a signature as an OCI referrer (falling back to a sha256-<digest> tag where the registry has no Referrers API); the Docker Hub OIDC scope must allow Image Push for those artifacts, and the provenance read-back needs provenance: true on the build."
          echo "::error::verify: scripts/ci/verify_signed_digest.sh tries cosign with and without --use-signed-timestamps and expects the verify --output json array of critical.image.docker-manifest-digest entries; its log above shows which check failed."
          echo "::error::tag: imagetools create needs Image Push on the repository."

      - name: What to check if Docker Scout failed
        if: failure() && steps.scout.outcome == 'failure'
        run: |
          echo "::error::Docker Scout could not analyse the rehearsal digest although the login and the push worked. Scout may not accept the OIDC credential: it may need a Docker Hub personal access token (the docker/scout-action inputs dockerhub-user and dockerhub-password, from a secret). If so, record that in TODO.md T-728 and settle it BEFORE DOCKERHUB_ENABLED is set, because the real build jobs call Scout the same way and would fail the same way."

      - name: What to check if this failed
        if: failure() && steps.scout.outcome != 'failure' && steps.sign.outcome != 'failure' && steps.verify.outcome != 'failure' && steps.retag.outcome != 'failure'
        run: |
          echo "::error::The Docker Hub rehearsal failed. The three most likely causes:"
          echo "::error::1. The ruleset's subject claim does not match this run. Use the immutable form repo:<owner>@<owner id>/<repository>@<repository id>:ref:refs/heads/main, not the mutable name form (or the reverse of what the connection was created with)."
          echo "::error::2. The ruleset does not cover this repository, or the connection is for another organisation than DOCKERHUB_NAMESPACE."
          echo "::error::3. The scope is missing: the ruleset needs Image Push on ${DOCKERHUB_NAMESPACE}/${IMAGE_REPOSITORY} (a failed login is cause 1 or 2, a failed push is cause 3)."
          echo "::error::Docker's guide: https://docs.docker.com/security/authentication/oidc-connections/troubleshoot . The connection's Failures tab in Docker Home (Identity & auth, OIDC connections) shows the claims Docker received and why the exchange was refused."

      - name: Log out of Docker Hub
        if: always()
        run: docker logout docker.io || true
