# Release workflow
# Triggered when a version tag v*.*.* is pushed (and, as a DRY RUN only, by Run workflow; see below).
# PROMOTES the image 200-build-images.yml already built, scanned (Docker Scout) and signed: it finds that image's
# digest by its `sha-<7>` tag (scripts/ci/find_release_image.sh), verifies its cosign signature, its SLSA
# provenance and its revision label (scripts/ci/verify_signed_digest.sh), and only then adds the `<version>` tag to
# the same digest (`imagetools create`: no rebuild, no new layers). Then it creates a GitHub Release with an
# auto-generated changelog from PRs merged since the last tag.
#
# Why promote and not build again: a second build of the same commit has no scan gate and is a different digest
# from the one consumers verify; and a `latest` tag pushed from here could move ahead of the scan that 200
# applies before it moves `latest`. So this workflow never builds, never pushes layers and never touches `latest`
# (200 owns it, after the scan).
#
# THE FOUR DIGESTS. The release notes list the digest of all four images of that build (CLI, api, web,
# migrator), each resolved from its own `sha-<7>` tag and verified the same way as the CLI digest
# (scripts/ci/release_digests.sh). The release job then gives each of the four a version tag: `X.Y.Z` for the CLI
# image and `api-X.Y.Z`, `web-X.Y.Z`, `migrator-X.Y.Z` for the others. Those tags match none of
# 370's SHA patterns, so they are never pruned and 370 keeps the sha tags that share an image with them: a released
# image stays pullable by tag and by digest. Hub tag names are plain names; the OIDC ruleset for `refs/tags/v*`
# below is about the GitHub ref of this run, and its one Image Push scope on the repository covers all four tags
# (the release job has no other registry credential than that login). Every tag is checked before any is created,
# and an existing tag with another digest stops the release (fail closed); a re-run skips tags already correct.
#
# THE RETIRED WORKER IMAGE (REVIEW.md R-016, owner decision 2026-10-27). 200 no longer builds a worker image, so no
# `worker-sha-<7>` tag exists for a new build: this workflow neither looks for one nor creates `worker-X.Y.Z`. The
# release notes below say so, because nobody is notified when the image set changes: whoever deploys the images reads
# them. Releases made before this change keep their `worker-X.Y.Z` tags, and 370 never prunes those.
# Small known gap: between that check and the creation another writer could create the same tag with another digest;
# the post-check then fails the job, but the tag has been moved. Docker Hub's immutable tags, if the plan offers
# them, would close it; that was not checked.
#
# WHICH COMMIT TO TAG. A commit that changes only documentation, tests or another workflow touches nothing 200 builds
# from, so the path filter gives it no 200 run. The search therefore walks back from the tagged commit to the nearest
# commit whose 200 run left a `sha-<7>` tag, and accepts the tagged commit when nothing changed between the two in a
# file 200 builds from (its `on.push.paths`). If the tagged commit changed such a file, the release fails and names
# it and the nearest built commit; tag that commit instead, or run 200 on the tagged one first. If no 200 build is
# found at all, the release fails with the same advice.
#
# DRY RUN. Actions, 310 · Release CLI Tool, Run workflow, branch main, `dry_run` ticked (the default): runs the
# search and the verification against the head of main, prints which digest it would promote, and stops. It never
# logs in for write, never creates a tag and never makes a release, so the cosign, jq and path logic is proven
# before any tag exists. It needs a published image (so after the first real 200 build) and a public repository
# (it reads anonymously) and no write scope and no OIDC token. It does not need DOCKERHUB_ENABLED. Run with `dry_run` unticked, the workflow does nothing.
#
# Required repository variables (no secret): DOCKERHUB_NAMESPACE, DOCKERHUB_CONNECTION (the Docker Hub OIDC
# connection id) and DOCKERHUB_ENABLED == 'true' (a pushed tag only). The tag run's OIDC subject is
# `repo:<owner>@<id>/<repo>@<id>:ref:refs/tags/vX.Y.Z`, which the connection's ruleset for main does not match: add a
# SECOND RULESET to the same connection with subject `...:ref:refs/tags/v*`, resource img-ne-appliance-app and the
# scope Image Push (Image Pull is not needed: the repository is public). TODO.md T-728 has the steps.
#
# IF THE POST-CHECK FAILS ("resolves to ... expected ..."): the version tag now exists with a digest other than the
# one that was verified. Do not re-run first: the re-run refuses to move an existing tag. Delete the tag on Docker
# Hub (Repository, Tags), find out why (a concurrent push of the same tag), then re-run this workflow.
#
# Permissions: the workflow grants nothing; the `verify` job (also the whole dry run) holds contents: read and
# actions: read, and only the `release` job after it holds contents: write and id-token: write. The repository setting
# Actions > General > Workflow permissions can stay on read-only.
name: "310 · Release CLI Tool"

# Runs on GitHub-hosted runners (ubuntu-latest): the release retags with a short-lived Docker Hub
# OIDC credential and creates the GitHub Release with GITHUB_TOKEN;
# no private network or cloud credentials are involved. The self-hosted runner
# the original repository used is retired.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: >-
          Dry run (the only thing Run workflow does): find and verify the image of the most recent 200 build and print
          what a release would promote. Never logs in for write, never creates a tag or a release.
        type: boolean
        default: true

# Least privilege per job: the workflow grants nothing, and each job declares what it needs.
#   verify  (push of a tag, or the dry run): contents: read and actions: read. It checks out, finds the image, runs cosign
#           and reads the registry anonymously. It cannot write to the repository and cannot mint an OIDC token, so the
#           dry run needs neither write scope.
#   release (push of a tag only, after verify): contents: write for the GitHub Release and id-token: write for the Docker
#           Hub login. Everything it acts on comes from verify's job outputs.
permissions: {}

env:
  # The Docker Hub repository the release tag is added to: the repository 200-build-images.yml
  # publishes to (same name; tests/security/test_image_repository_name.py keeps them equal).
  # Never the retired `cna`.
  IMAGE_REPOSITORY: img-ne-appliance-app
  # The cosign release 200 signs with (keep in step with COSIGN_VERSION there).
  COSIGN_VERSION: v3.1.3

# One release run per tag — don't let a re-pushed tag race a still-running
# release; serialize rather than cancel so a partial GitHub Release isn't left.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:

  verify:
    name: Find and verify the image
    runs-on: ubuntu-latest
    # A pushed tag needs publishing switched on; the dry run does not, and runs from main only.
    if: >-
      (github.event_name == 'push' && vars.DOCKERHUB_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.dry_run &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    # Includes the wait for an in-flight 200 build of the tagged commit (up to 25 minutes).
    timeout-minutes: 40
    permissions:
      contents: read   # checkout
      actions: read    # find the 200 build of the tagged commit (gh run list)
    env:
      REGISTRY: docker.io
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
    outputs:
      digest: ${{ steps.scanned.outputs.digest }}
      build_commit: ${{ steps.scanned.outputs.build_commit }}
      run_ids: ${{ steps.scanned.outputs.run_ids }}
      tag: ${{ steps.scanned.outputs.tag }}
      digest_api: ${{ steps.others.outputs.digest_api }}
      digest_web: ${{ steps.others.outputs.digest_web }}
      digest_migrator: ${{ steps.others.outputs.digest_migrator }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate Docker Hub namespace
        run: |
          if [ -z "$DOCKERHUB_NAMESPACE" ]; then
            echo "::error::DOCKERHUB_NAMESPACE variable is required."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      # The digest 200 built, scanned and tagged `sha-<7>` for the tagged commit, or for the nearest earlier
      # commit it built when nothing 200 builds from changed since (see the header). 200 attaches that tag only
      # after every image passed Docker Scout, so its existence is the scan gate. Anonymous reads: the repository
      # is public, and no write credential exists in this job.
      - name: Find the scanned image built from this commit
        id: scanned
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/find_release_image.sh

      # Do not weaken: a digest 200 did not sign, did not build from that commit, or that no 200 run of it
      # produced is not promoted, whatever its tag says. This step has no `||` and no continue-on-error; the
      # tests pin that.
      - name: Verify the signature and provenance of that digest
        id: cli
        env:
          DIGEST: ${{ steps.scanned.outputs.digest }}
          EXPECTED_REVISION: ${{ steps.scanned.outputs.build_commit }}
          EXPECTED_RUN_IDS: ${{ steps.scanned.outputs.run_ids }}
          EMIT_BUILDER_RUN_ID: "true"
        run: bash scripts/ci/verify_signed_digest.sh "${REGISTRY}/${DOCKERHUB_NAMESPACE}/${IMAGE_REPOSITORY}@${DIGEST}"

      # The other three images of the same build: each must exist under its own `sha-<7>` tag (a missing one means an
      # incomplete build and stops the release) and must verify like the CLI digest above. No `||`, no `if`: the
      # tests pin that, as for the step above.
      - name: Find and verify the other images of that build
        id: others
        env:
          BUILD_COMMIT: ${{ steps.scanned.outputs.build_commit }}
          # The ONE run that built the CLI image, not every run of the commit: the four images of a release come
          # from the same build even if the commit was built twice.
          RUN_IDS: ${{ steps.cli.outputs.builder_run_id }}
        run: bash scripts/ci/release_digests.sh

      - name: Report what a release would promote (dry run)
        if: github.event_name == 'workflow_dispatch'
        env:
          DIGEST: ${{ steps.scanned.outputs.digest }}
          BUILD_COMMIT: ${{ steps.scanned.outputs.build_commit }}
          SHA_TAG: ${{ steps.scanned.outputs.tag }}
          DIGEST_API: ${{ steps.others.outputs.digest_api }}
          DIGEST_WEB: ${{ steps.others.outputs.digest_web }}
          DIGEST_MIGRATOR: ${{ steps.others.outputs.digest_migrator }}
        run: |
          {
            echo "### 310 dry run: nothing was logged in, tagged or released"
            echo ""
            echo "- head of main: \`${GITHUB_SHA}\`"
            echo "- image found: \`${REGISTRY}/${DOCKERHUB_NAMESPACE}/${IMAGE_REPOSITORY}:${SHA_TAG}\`"
            echo "- built from commit: \`${BUILD_COMMIT}\`"
            echo "- signature, provenance and revision label of all four images: verified"
            echo "- a pushed \`vX.Y.Z\` tag would add the tags \`X.Y.Z\` (CLI), \`api-X.Y.Z\`, \`web-X.Y.Z\` and \`migrator-X.Y.Z\`"
            echo ""
            echo "| Component | Tag | Digest |"
            echo "| --- | --- | --- |"
            echo "| cli | \`${SHA_TAG}\` | \`${DIGEST}\` |"
            echo "| api | \`api-${SHA_TAG}\` | \`${DIGEST_API}\` |"
            echo "| web | \`web-${SHA_TAG}\` | \`${DIGEST_WEB}\` |"
            echo "| migrator | \`migrator-${SHA_TAG}\` | \`${DIGEST_MIGRATOR}\` |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  release:
    name: Promote and release
    needs: verify
    runs-on: ubuntu-latest
    # Only a pushed tag writes anything, and only with publishing on. A Run workflow dry run never reaches this job.
    if: github.event_name == 'push' && vars.DOCKERHUB_ENABLED == 'true'
    timeout-minutes: 15
    permissions:
      contents: write   # create the GitHub Release
      id-token: write   # OIDC (Docker Hub login, see the Docker Hub steps below)
    env:
      REGISTRY: docker.io
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}

    steps:
      # scripts/ci/registry_digest.sh is read from the tagged commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Extract version from tag
      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Validate Docker Hub namespace
        run: |
          if [ -z "$DOCKERHUB_NAMESPACE" ]; then
            echo "::error::DOCKERHUB_NAMESPACE variable is required."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # Log in to Docker Hub, just before the only step that writes to it.
      - name: Log in to Docker Hub
        id: login
        # Docker Hub's OIDC connection (REFACTOR_APP.md change set J): the action
        # exchanges this job's id-token for a short-lived registry credential, so no
        # long-lived access token is stored.
        # The subject of this run is the tag (refs/tags/v…), not main: the connection needs its own ruleset.
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_CONNECTION }}
          DOCKERHUB_OIDC_EXPIREIN: '900'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.DOCKERHUB_NAMESPACE }}

      # Version tags for all four images of the verified build: `X.Y.Z` for the CLI image and `<component>-X.Y.Z`
      # for api, web and migrator. They are outside the SHA patterns, so 370 never prunes them and keeps
      # the sha tags that share an image with them. Phase 1 checks every tag before anything is written, so a
      # tag that already points at another digest stops the release before it creates any tag; phase 2 creates the
      # missing ones and reads each back. A re-run after a partial failure repeats phase 1, skips what is done
      # and creates the rest.
      - name: Promote the digests to the release tags
        id: promote
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          DIGEST_CLI: ${{ needs.verify.outputs.digest }}
          DIGEST_API: ${{ needs.verify.outputs.digest_api }}
          DIGEST_WEB: ${{ needs.verify.outputs.digest_web }}
          DIGEST_MIGRATOR: ${{ needs.verify.outputs.digest_migrator }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/ci/registry_digest.sh
          source scripts/ci/registry_digest.sh
          IMAGE="${REGISTRY}/${DOCKERHUB_NAMESPACE}/${IMAGE_REPOSITORY}"
          declare -A DIGESTS=(
            [cli]="$DIGEST_CLI" [api]="$DIGEST_API"
            [web]="$DIGEST_WEB" [migrator]="$DIGEST_MIGRATOR"
          )
          declare -A TAGS=(
            [cli]="${VERSION}" [api]="api-${VERSION}"
            [web]="web-${VERSION}" [migrator]="migrator-${VERSION}"
          )
          COMPONENTS="cli api web migrator"
          for c in $COMPONENTS; do
            if ! [[ "${DIGESTS[$c]}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::No valid digest for '${c}' (got '${DIGESTS[$c]}'); refusing to create any release tag."
              exit 1
            fi
          done

          # Phase 1. A release tag is immutable: refuse to move it to another digest. "Not found" and "could not
          # ask" are different answers: only the first lets the tag be created.
          declare -A MISSING=()
          for c in $COMPONENTS; do
            rc=0
            EXISTING="$(registry_digest "${IMAGE}:${TAGS[$c]}")" || rc=$?
            case "$rc" in
              0)
                if [ "$EXISTING" = "${DIGESTS[$c]}" ]; then
                  echo "${IMAGE}:${TAGS[$c]} already points at ${DIGESTS[$c]}; nothing to do."
                else
                  echo "::error::${IMAGE}:${TAGS[$c]} already exists with digest ${EXISTING}, not ${DIGESTS[$c]}; a release tag is never moved. No release tag was created by this run."
                  exit 1
                fi
                ;;
              1) MISSING[$c]=yes ;;
              *)
                echo "::error::Could not check whether ${IMAGE}:${TAGS[$c]} exists (the registry's message is above); refusing to create a release tag blind."
                exit 1
                ;;
            esac
          done

          # Phase 2.
          for c in $COMPONENTS; do
            [ -n "${MISSING[$c]:-}" ] || continue
            docker buildx imagetools create -t "${IMAGE}:${TAGS[$c]}" "${IMAGE}@${DIGESTS[$c]}"
            rc=0
            AFTER="$(registry_digest "${IMAGE}:${TAGS[$c]}")" || rc=$?
            if [ "$rc" -ne 0 ] || [ "$AFTER" != "${DIGESTS[$c]}" ]; then
              echo "::error::After creating it, ${IMAGE}:${TAGS[$c]} resolves to '${AFTER:-nothing}' (check status ${rc}), expected ${DIGESTS[$c]}. Delete that tag on Docker Hub (Repository, Tags) before re-running: a re-run refuses to move an existing tag."
              exit 1
            fi
            echo "Promoted ${IMAGE}@${DIGESTS[$c]} to ${IMAGE}:${TAGS[$c]}"
          done

      - name: What to check if the Docker Hub login or the promotion failed
        if: failure() && (steps.login.outcome == 'failure' || steps.promote.outcome == 'failure')
        run: |
          echo "::error::The Docker Hub step of the release failed. The three most likely causes:"
          echo "::error::1. The connection has no ruleset for tags. This run's subject is repo:<owner>@<id>/<repo>@<id>:ref:refs/tags/${GITHUB_REF_NAME}; the ruleset for main does not match it. Add a SECOND RULESET to the same connection with the subject ...:ref:refs/tags/v* (immutable owner and repository ids, not the mutable names)."
          echo "::error::2. That ruleset does not cover the repository ${DOCKERHUB_NAMESPACE}/${IMAGE_REPOSITORY}, or the connection belongs to another organisation than DOCKERHUB_NAMESPACE."
          echo "::error::3. The scope is missing: the tag ruleset needs Image Push on ${DOCKERHUB_NAMESPACE}/${IMAGE_REPOSITORY} (a failed login is cause 1 or 2, a failed tag creation is cause 3)."
          echo "::error::Docker's guide: https://docs.docker.com/security/authentication/oidc-connections/troubleshoot . The connection's Failures tab in Docker Home (Identity & auth, OIDC connections) shows the claims Docker received and why the exchange was refused."

      # GitHub Release with auto-generated changelog. The digests come from the verify job's outputs (they are
      # validated hex digests and only appear in this input, never in a shell script).
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          generate_release_notes: true
          body: |
            ## NetworkEyes ${{ github.ref_name }}

            Docker image: `${{ env.REGISTRY }}/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_REPOSITORY }}:${{ steps.version.outputs.VERSION }}`
            (digest `${{ needs.verify.outputs.digest }}`: the image `200-build-images.yml` built, scanned and signed from commit `${{ needs.verify.outputs.build_commit }}`)

            ```bash
            docker pull ${{ env.REGISTRY }}/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_REPOSITORY }}:${{ steps.version.outputs.VERSION }}
            docker run --rm ${{ env.REGISTRY }}/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_REPOSITORY }}:${{ steps.version.outputs.VERSION }} --help
            ```

            ### Images in this release

            All four images were built from commit `${{ needs.verify.outputs.build_commit }}` by `200-build-images.yml`. Each digest below was
            checked before this release was created: signed and attested by that workflow (cosign, keyless), built by one of its runs for that
            commit, and carrying that commit as its `org.opencontainers.image.revision` label. Each image has a version tag that
            `370-registry-cleanup.yml` never prunes. Pull by digest and verify the signature before you run an image.

            | Component | Version tag | Tag at build time | Digest |
            | --- | --- | --- | --- |
            | cli | `${{ steps.version.outputs.VERSION }}` | `${{ needs.verify.outputs.tag }}` | `${{ needs.verify.outputs.digest }}` |
            | api | `api-${{ steps.version.outputs.VERSION }}` | `api-${{ needs.verify.outputs.tag }}` | `${{ needs.verify.outputs.digest_api }}` |
            | web | `web-${{ steps.version.outputs.VERSION }}` | `web-${{ needs.verify.outputs.tag }}` | `${{ needs.verify.outputs.digest_web }}` |
            | migrator | `migrator-${{ steps.version.outputs.VERSION }}` | `migrator-${{ needs.verify.outputs.tag }}` | `${{ needs.verify.outputs.digest_migrator }}` |

            **There is no `worker` image any more.** It was a placeholder that the API's `POST /publish` endpoint replaced, and the image
            could not even start. `200-build-images.yml` no longer builds or publishes it (owner decision 2026-10-27), so this release has no
            `worker-` version tag and no worker digest. **If your deployment still runs a worker service (the container that ran the `worker`
            image), remove that service. Nothing else in your deployment changes.** The `worker-` tags of earlier builds and releases stay on Docker Hub.

            Registry retention: the version tags are permanent. The build-time `sha` tags are pruned after the newest 10 builds per
            component, except those that share an image with a version tag, so a released image stays pullable by tag and by digest.

            ### Verify before you run

            ```bash
            IMAGE=${{ env.REGISTRY }}/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_REPOSITORY }}@sha256:<64 hex from the table>
            ID=${{ github.server_url }}/${{ github.repository }}/.github/workflows/200-build-images.yml@refs/heads/main
            ISS=https://token.actions.githubusercontent.com
            cosign verify "$IMAGE" --certificate-identity "$ID" --certificate-oidc-issuer "$ISS"
            cosign verify-attestation "$IMAGE" --type slsaprovenance02 --certificate-identity "$ID" --certificate-oidc-issuer "$ISS" \
              | jq -r '.payload | @base64d | fromjson | .predicate.builder.id'
            ```

            The last command prints the builder of the build; it must begin with `${{ github.server_url }}/${{ github.repository }}/actions/runs/`.

            Pass `--use-signed-timestamps` for the signed timestamp from the timestamp authority; without it cosign 3 uses the
            transparency-log time. The identity string must match exactly. Renaming or transferring this repository, or renaming the
            workflow file or the default branch, changes it; such a change is announced in the release notes. A digest that does not
            verify must not be deployed.
