# Release workflow
# Triggered when a version tag v*.*.* is pushed.
# Builds the Docker image, pushes to Docker Hub, creates a GitHub Release
# with auto-generated changelog from PRs merged since last tag.
#
# Required repository variables (no secret): DOCKERHUB_NAMESPACE, DOCKERHUB_CONNECTION
# (the Docker Hub OIDC connection id) and DOCKERHUB_ENABLED == 'true'.
#
# Required repository settings:
#   Actions > General > Workflow permissions: Read and write
name: "310 · Release CLI Tool"

# Runs on GitHub-hosted runners (ubuntu-latest): the release builds and pushes
# with the repository secrets and creates the GitHub Release with GITHUB_TOKEN;
# no private network or cloud credentials are involved. The self-hosted runner
# the original repository used is retired.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write    # create GitHub Release
  id-token: write    # OIDC (Docker Hub login, see the Docker Hub steps below)

# One release run per tag — don't let a re-pushed tag race a still-running
# release; serialize rather than cancel so a partial GitHub Release isn't left.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:

  release:
    name: Build, Push, Release
    runs-on: ubuntu-latest
    if: vars.DOCKERHUB_ENABLED == 'true'
    timeout-minutes: 30
    env:
      REGISTRY: docker.io
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
      IMAGE_REPOSITORY: cna

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      # Extract version from tag
      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Validate Docker Hub namespace
        run: |
          if [ -z "$DOCKERHUB_NAMESPACE" ]; then
            echo "::error::DOCKERHUB_NAMESPACE variable is required."
            exit 1
          fi

      # Log in to Docker Hub
      - name: Log in to Docker Hub
        # Docker Hub's OIDC connection (REFACTOR_APP.md change set J): the action
        # exchanges this job's id-token for a 15-minute registry credential, so no
        # long-lived access token is stored. [VERIFY] the env variable names and the
        # minimum login-action version against the Docker Hub OIDC documentation.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_CONNECTION }}
          DOCKERHUB_OIDC_EXPIREIN: '900'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.DOCKERHUB_NAMESPACE }}

      # Docker Buildx for multi-platform + cache
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # Build & push image: latest + version tag
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_REPOSITORY }}:latest
            ${{ env.REGISTRY }}/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_REPOSITORY }}:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            CNA_VERSION=${{ steps.version.outputs.VERSION }}

      # GitHub Release with auto-generated changelog
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          generate_release_notes: true
          body: |
            ## CNA Platform ${{ github.ref_name }}

            Docker image: `${{ env.REGISTRY }}/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_REPOSITORY }}:${{ steps.version.outputs.VERSION }}`

            ```bash
            docker pull ${{ env.REGISTRY }}/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_REPOSITORY }}:${{ steps.version.outputs.VERSION }}
            docker run --rm ${{ env.REGISTRY }}/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_REPOSITORY }}:${{ steps.version.outputs.VERSION }} --help
            ```
