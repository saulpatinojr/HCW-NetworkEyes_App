# Release workflow
# Triggered when a version tag v*.*.* is pushed.
# PROMOTES the image 200-build-images.yml already built, scanned (Docker Scout) and signed for the
# tagged commit: it finds that image's digest by its `sha-<7>` tag, verifies the cosign signature and
# SLSA provenance against 200's identity (scripts/ci/verify_signed_digest.sh), and only then adds the
# `<version>` tag to the same digest (`imagetools create`: no rebuild, no new layers). Then it creates
# a GitHub Release with an auto-generated changelog from PRs merged since the last tag.
#
# Why promote and not build again: a second build of the same commit has no scan gate and is a
# different digest from the one the appliances verify; and a `latest` tag pushed from here could move
# ahead of the scan that 200 applies before it moves `latest`. So this workflow never builds, never
# pushes layers and never touches `latest` (200 owns it, after the scan). If no 200 build exists for
# the tagged commit, or its image was not tagged (scan failed, publishing off, tag pruned by 370),
# the release fails with a message that says which; tag a commit 200 built, or run 200 from
# *Run workflow* on that commit's branch first.
#
# Required repository variables (no secret): DOCKERHUB_NAMESPACE, DOCKERHUB_CONNECTION
# (the Docker Hub OIDC connection id) and DOCKERHUB_ENABLED == 'true'. The OIDC connection needs a
# subject-claim rule for tags (`refs/tags/*`) with image pull and push on the repository, besides
# the one for `refs/heads/main` that 200 uses (TODO.md T-728).
#
# Required repository settings:
#   Actions > General > Workflow permissions: Read and write
name: "310 · Release CLI Tool"

# Runs on GitHub-hosted runners (ubuntu-latest): the release retags with a short-lived Docker Hub
# OIDC credential and creates the GitHub Release with GITHUB_TOKEN;
# no private network or cloud credentials are involved. The self-hosted runner
# the original repository used is retired.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write    # create GitHub Release
  id-token: write    # OIDC (Docker Hub login, see the Docker Hub steps below)
  actions: read      # find the 200 build of the tagged commit (gh run list)

env:
  # The Docker Hub repository the release tag is added to: the repository 200-build-images.yml
  # publishes to (same name; tests/security/test_image_repository_name.py keeps them equal).
  # Never the retired `cna`.
  IMAGE_REPOSITORY: img-ne-appliance-app
  # The cosign release 200 signs with (keep in step with COSIGN_VERSION there).
  COSIGN_VERSION: v3.1.3

# One release run per tag — don't let a re-pushed tag race a still-running
# release; serialize rather than cancel so a partial GitHub Release isn't left.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:

  release:
    name: Build, Push, Release
    runs-on: ubuntu-latest
    if: vars.DOCKERHUB_ENABLED == 'true'
    # Includes the wait for an in-flight 200 build of the tagged commit (up to 25 minutes).
    timeout-minutes: 40
    env:
      REGISTRY: docker.io
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      # Extract version from tag
      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Validate Docker Hub namespace
        run: |
          if [ -z "$DOCKERHUB_NAMESPACE" ]; then
            echo "::error::DOCKERHUB_NAMESPACE variable is required."
            exit 1
          fi

      # Log in to Docker Hub
      - name: Log in to Docker Hub
        # Docker Hub's OIDC connection (REFACTOR_APP.md change set J): the action
        # exchanges this job's id-token for a short-lived registry credential, so no
        # long-lived access token is stored. [VERIFY] the env variable names and the
        # minimum login-action version against the Docker Hub OIDC documentation.
        # The subject of this run is the tag (refs/tags/v…), not main: the connection needs its own rule.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_CONNECTION }}
          DOCKERHUB_OIDC_EXPIREIN: '900'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.DOCKERHUB_NAMESPACE }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      # The digest 200 built, scanned and tagged `sha-<7>` for this very commit. 200 attaches that tag
      # only after every image passed Docker Scout, so its existence is the scan gate.
      - name: Find the scanned image built from this commit
        id: scanned
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${DOCKERHUB_NAMESPACE}/${IMAGE_REPOSITORY}"
          SHA_TAG="sha-${GITHUB_SHA:0:7}"
          DEADLINE=$((SECONDS + 1500))
          while :; do
            if DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${SHA_TAG}" --format '{{.Manifest.Digest}}' 2>/dev/null) \
               && [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              break
            fi
            RUNS=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow 200-build-images.yml --commit "$GITHUB_SHA" --limit 20 --json status,url)
            if [ "$(jq 'length' <<< "$RUNS")" -eq 0 ]; then
              echo "::error::No run of 200-build-images.yml exists for commit ${GITHUB_SHA}, so there is no scanned image to release. 200 builds only when a Dockerfile, the code or its own file changes: tag a commit it built, or run 200 on this commit first."
              exit 1
            fi
            if [ "$(jq '[.[] | select(.status != "completed")] | length' <<< "$RUNS")" -eq 0 ]; then
              echo "::error::200-build-images.yml finished for commit ${GITHUB_SHA} but ${IMAGE}:${SHA_TAG} does not exist: its scan or build failed, publishing was off, or 370 pruned the tag. Runs: $(jq -r '[.[].url] | join(" ")' <<< "$RUNS")"
              exit 1
            fi
            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "::error::Waited 25 minutes for 200-build-images.yml to tag ${IMAGE}:${SHA_TAG}; re-run this release when it has finished."
              exit 1
            fi
            echo "200-build-images.yml is still building ${GITHUB_SHA:0:7}; waiting 30 s for ${IMAGE}:${SHA_TAG}"
            sleep 30
          done
          echo "Found ${IMAGE}:${SHA_TAG} = ${DIGEST}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      # Do not weaken: a digest 200 did not sign is not promoted, whatever its tag says.
      - name: Verify the signature and provenance of that digest
        env:
          DIGEST: ${{ steps.scanned.outputs.digest }}
        run: scripts/ci/verify_signed_digest.sh "${REGISTRY}/${DOCKERHUB_NAMESPACE}/${IMAGE_REPOSITORY}@${DIGEST}"

      - name: Promote the digest to the release tag
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          DIGEST: ${{ steps.scanned.outputs.digest }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${DOCKERHUB_NAMESPACE}/${IMAGE_REPOSITORY}"
          # A release tag is immutable: refuse to move it to another digest.
          if EXISTING=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{.Manifest.Digest}}' 2>/dev/null); then
            if [ "$EXISTING" = "$DIGEST" ]; then
              echo "${IMAGE}:${VERSION} already points at ${DIGEST}; nothing to do."
              exit 0
            fi
            echo "::error::${IMAGE}:${VERSION} already exists with digest ${EXISTING}, not ${DIGEST}; a release tag is never moved."
            exit 1
          fi
          docker buildx imagetools create -t "${IMAGE}:${VERSION}" "${IMAGE}@${DIGEST}"
          AFTER=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{.Manifest.Digest}}')
          if [ "$AFTER" != "$DIGEST" ]; then
            echo "::error::${IMAGE}:${VERSION} resolves to ${AFTER}, expected ${DIGEST}."
            exit 1
          fi
          echo "Promoted ${IMAGE}@${DIGEST} to ${IMAGE}:${VERSION}"

      # GitHub Release with auto-generated changelog
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          generate_release_notes: true
          body: |
            ## CNA Platform ${{ github.ref_name }}

            Docker image: `${{ env.REGISTRY }}/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_REPOSITORY }}:${{ steps.version.outputs.VERSION }}`
            (digest `${{ steps.scanned.outputs.digest }}`: the image `200-build-images.yml` built, scanned and signed for this commit)

            ```bash
            docker pull ${{ env.REGISTRY }}/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_REPOSITORY }}:${{ steps.version.outputs.VERSION }}
            docker run --rm ${{ env.REGISTRY }}/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_REPOSITORY }}:${{ steps.version.outputs.VERSION }} --help
            ```
