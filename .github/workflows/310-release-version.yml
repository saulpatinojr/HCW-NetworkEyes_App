# Release workflow
# Triggered when a version tag v*.*.* is pushed (and, as a DRY RUN only, by Run workflow; see below).
# PROMOTES the image 200-build-images.yml already built, scanned (Docker Scout) and signed: it finds that image's
# digest by its `sha-<7>` tag (scripts/ci/find_release_image.sh), verifies its cosign signature, its SLSA
# provenance and its revision label (scripts/ci/verify_signed_digest.sh), and only then adds the `<version>` tag to
# the same digest (`imagetools create`: no rebuild, no new layers). Then it creates a GitHub Release with an
# auto-generated changelog from PRs merged since the last tag.
#
# Why promote and not build again: a second build of the same commit has no scan gate and is a different digest
# from the one the appliances verify; and a `latest` tag pushed from here could move ahead of the scan that 200
# applies before it moves `latest`. So this workflow never builds, never pushes layers and never touches `latest`
# (200 owns it, after the scan).
#
# WHICH COMMIT TO TAG. Every successful 200 ends with a squash commit that only changes
# .deployment-catalog/latest-build.json, a path 200 does not build from, so the head of main right after a build
# has no 200 run of its own. The search therefore walks back from the tagged commit to the nearest commit whose 200
# run left a `sha-<7>` tag, and accepts the tagged commit when nothing changed between the two in a file 200 builds
# from (its `on.push.paths`): documentation, or the manifest commit. If the tagged commit changed such a file, the
# release fails and names it; tag the commit recorded as `commit` in .deployment-catalog/latest-build.json instead.
# If no 200 build is found at all, the release fails with that same advice.
#
# DRY RUN. Actions, 310 · Release CLI Tool, Run workflow, branch main, `dry_run` ticked (the default): runs the
# search and the verification against the head of main, prints which digest it would promote, and stops. It never
# logs in for write, never creates a tag and never makes a release, so the cosign, jq and path logic is proven
# before any tag exists. It needs a published image (so after the first real 200 build) and a public repository
# (it reads anonymously). It does not need DOCKERHUB_ENABLED. Run with `dry_run` unticked, the workflow does nothing.
#
# Required repository variables (no secret): DOCKERHUB_NAMESPACE, DOCKERHUB_CONNECTION (the Docker Hub OIDC
# connection id) and DOCKERHUB_ENABLED == 'true' (a pushed tag only). The tag run's OIDC subject is
# `repo:<owner>@<id>/<repo>@<id>:ref:refs/tags/vX.Y.Z`, which the connection's ruleset for main does not match: add a
# SECOND RULESET to the same connection with subject `...:ref:refs/tags/v*`, resource img-ne-appliance-app and the
# scope Image Push (Image Pull is not needed: the repository is public). TODO.md T-728 has the steps.
#
# IF THE POST-CHECK FAILS ("resolves to ... expected ..."): the version tag now exists with a digest other than the
# one that was verified. Do not re-run first: the re-run refuses to move an existing tag. Delete the tag on Docker
# Hub (Repository, Tags), find out why (a concurrent push of the same tag), then re-run this workflow.
#
# Required repository settings:
#   Actions > General > Workflow permissions: Read and write
name: "310 · Release CLI Tool"

# Runs on GitHub-hosted runners (ubuntu-latest): the release retags with a short-lived Docker Hub
# OIDC credential and creates the GitHub Release with GITHUB_TOKEN;
# no private network or cloud credentials are involved. The self-hosted runner
# the original repository used is retired.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: >-
          Dry run (the only thing Run workflow does): find and verify the image of the most recent 200 build and print
          what a release would promote. Never logs in for write, never creates a tag or a release.
        type: boolean
        default: true

permissions:
  contents: write    # create GitHub Release
  id-token: write    # OIDC (Docker Hub login, see the Docker Hub steps below)
  actions: read      # find the 200 build of the tagged commit (gh run list)

env:
  # The Docker Hub repository the release tag is added to: the repository 200-build-images.yml
  # publishes to (same name; tests/security/test_image_repository_name.py keeps them equal).
  # Never the retired `cna`.
  IMAGE_REPOSITORY: img-ne-appliance-app
  # The cosign release 200 signs with (keep in step with COSIGN_VERSION there).
  COSIGN_VERSION: v3.1.3

# One release run per tag — don't let a re-pushed tag race a still-running
# release; serialize rather than cancel so a partial GitHub Release isn't left.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:

  release:
    name: Build, Push, Release
    runs-on: ubuntu-latest
    # A pushed tag needs publishing switched on; the dry run does not, and runs from main only.
    if: >-
      (github.event_name == 'push' && vars.DOCKERHUB_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.dry_run &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    # Includes the wait for an in-flight 200 build of the tagged commit (up to 25 minutes).
    timeout-minutes: 40
    env:
      REGISTRY: docker.io
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      # Extract version from tag
      - name: Extract version
        id: version
        if: github.event_name == 'push'
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Validate Docker Hub namespace
        run: |
          if [ -z "$DOCKERHUB_NAMESPACE" ]; then
            echo "::error::DOCKERHUB_NAMESPACE variable is required."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      # The digest 200 built, scanned and tagged `sha-<7>` for the tagged commit, or for the nearest earlier
      # commit it built when nothing 200 builds from changed since (see the header). 200 attaches that tag only
      # after every image passed Docker Scout, so its existence is the scan gate. Anonymous reads: the repository
      # is public, and no write credential exists yet at this point.
      - name: Find the scanned image built from this commit
        id: scanned
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/find_release_image.sh

      # Do not weaken: a digest 200 did not sign, did not build from that commit, or that no 200 run of it
      # produced is not promoted, whatever its tag says. This step has no `||` and no continue-on-error; the
      # tests pin that.
      - name: Verify the signature and provenance of that digest
        env:
          DIGEST: ${{ steps.scanned.outputs.digest }}
          EXPECTED_REVISION: ${{ steps.scanned.outputs.build_commit }}
          EXPECTED_RUN_IDS: ${{ steps.scanned.outputs.run_ids }}
        run: bash scripts/ci/verify_signed_digest.sh "${REGISTRY}/${DOCKERHUB_NAMESPACE}/${IMAGE_REPOSITORY}@${DIGEST}"

      - name: Report what a release would promote (dry run)
        if: github.event_name == 'workflow_dispatch'
        env:
          DIGEST: ${{ steps.scanned.outputs.digest }}
          BUILD_COMMIT: ${{ steps.scanned.outputs.build_commit }}
          SHA_TAG: ${{ steps.scanned.outputs.tag }}
        run: |
          {
            echo "### 310 dry run: nothing was logged in, tagged or released"
            echo ""
            echo "- head of main: \`${GITHUB_SHA}\`"
            echo "- image found: \`${REGISTRY}/${DOCKERHUB_NAMESPACE}/${IMAGE_REPOSITORY}:${SHA_TAG}\`"
            echo "- digest: \`${DIGEST}\`"
            echo "- built from commit: \`${BUILD_COMMIT}\`"
            echo "- signature, provenance and revision label: verified"
            echo "- a pushed \`vX.Y.Z\` tag would add the tag \`X.Y.Z\` to that digest"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Log in to Docker Hub, just before the only step that writes to it.
      - name: Log in to Docker Hub
        id: login
        if: github.event_name == 'push'
        # Docker Hub's OIDC connection (REFACTOR_APP.md change set J): the action
        # exchanges this job's id-token for a short-lived registry credential, so no
        # long-lived access token is stored.
        # The subject of this run is the tag (refs/tags/v…), not main: the connection needs its own ruleset.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_CONNECTION }}
          DOCKERHUB_OIDC_EXPIREIN: '900'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.DOCKERHUB_NAMESPACE }}

      - name: Promote the digest to the release tag
        id: promote
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          DIGEST: ${{ steps.scanned.outputs.digest }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/ci/registry_digest.sh
          source scripts/ci/registry_digest.sh
          IMAGE="${REGISTRY}/${DOCKERHUB_NAMESPACE}/${IMAGE_REPOSITORY}"
          # A release tag is immutable: refuse to move it to another digest. "Not found" and "could not ask" are
          # different answers: only the first lets the tag be created.
          rc=0
          EXISTING="$(registry_digest "${IMAGE}:${VERSION}")" || rc=$?
          case "$rc" in
            0)
              if [ "$EXISTING" = "$DIGEST" ]; then
                echo "${IMAGE}:${VERSION} already points at ${DIGEST}; nothing to do."
                exit 0
              fi
              echo "::error::${IMAGE}:${VERSION} already exists with digest ${EXISTING}, not ${DIGEST}; a release tag is never moved."
              exit 1
              ;;
            1) ;;
            *)
              echo "::error::Could not check whether ${IMAGE}:${VERSION} exists (the registry's message is above); refusing to create a release tag blind."
              exit 1
              ;;
          esac
          docker buildx imagetools create -t "${IMAGE}:${VERSION}" "${IMAGE}@${DIGEST}"
          rc=0
          AFTER="$(registry_digest "${IMAGE}:${VERSION}")" || rc=$?
          if [ "$rc" -ne 0 ] || [ "$AFTER" != "$DIGEST" ]; then
            echo "::error::After creating it, ${IMAGE}:${VERSION} resolves to '${AFTER:-nothing}' (check status ${rc}), expected ${DIGEST}. Delete that tag on Docker Hub (Repository, Tags) before re-running: a re-run refuses to move an existing tag."
            exit 1
          fi
          echo "Promoted ${IMAGE}@${DIGEST} to ${IMAGE}:${VERSION}"

      - name: What to check if the Docker Hub login or the promotion failed
        if: failure() && (steps.login.outcome == 'failure' || steps.promote.outcome == 'failure')
        run: |
          echo "::error::The Docker Hub step of the release failed. The three most likely causes:"
          echo "::error::1. The connection has no ruleset for tags. This run's subject is repo:<owner>@<id>/<repo>@<id>:ref:refs/tags/${GITHUB_REF_NAME}; the ruleset for main does not match it. Add a SECOND RULESET to the same connection with the subject ...:ref:refs/tags/v* (immutable owner and repository ids, not the mutable names)."
          echo "::error::2. That ruleset does not cover the repository ${DOCKERHUB_NAMESPACE}/${IMAGE_REPOSITORY}, or the connection belongs to another organisation than DOCKERHUB_NAMESPACE."
          echo "::error::3. The scope is missing: the tag ruleset needs Image Push on ${DOCKERHUB_NAMESPACE}/${IMAGE_REPOSITORY} (a failed login is cause 1 or 2, a failed tag creation is cause 3)."
          echo "::error::Docker's guide: https://docs.docker.com/security/authentication/oidc-connections/troubleshoot . The connection's Failures tab in Docker Home (Identity & auth, OIDC connections) shows the claims Docker received and why the exchange was refused."

      # GitHub Release with auto-generated changelog
      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          generate_release_notes: true
          body: |
            ## CNA Platform ${{ github.ref_name }}

            Docker image: `${{ env.REGISTRY }}/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_REPOSITORY }}:${{ steps.version.outputs.VERSION }}`
            (digest `${{ steps.scanned.outputs.digest }}`: the image `200-build-images.yml` built, scanned and signed from commit `${{ steps.scanned.outputs.build_commit }}`)

            ```bash
            docker pull ${{ env.REGISTRY }}/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_REPOSITORY }}:${{ steps.version.outputs.VERSION }}
            docker run --rm ${{ env.REGISTRY }}/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_REPOSITORY }}:${{ steps.version.outputs.VERSION }} --help
            ```
