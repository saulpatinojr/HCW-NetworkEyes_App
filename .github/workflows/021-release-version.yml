# Release workflow
# Triggered when a version tag v*.*.* is pushed.
# Builds the Docker image, pushes to GHCR, creates a GitHub Release
# with auto-generated changelog from PRs merged since last tag.
#
# Required repository secrets:
#   None — uses GITHUB_TOKEN and OIDC for GHCR push
#
# Required repository settings:
#   Actions > General > Workflow permissions: Read and write
#   (or grant packages:write explicitly in permissions block below)
name: "021 · Release CLI Tool"

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write    # create GitHub Release
  packages: write    # push to GHCR
  id-token: write    # OIDC (future Cosign signing)

jobs:

  release:
    name: Build, Push, Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/cna

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0

      # Extract version from tag
      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      # Log in to GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Buildx for multi-platform + cache
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      # Build & push image: latest + version tag
      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            CNA_VERSION=${{ steps.version.outputs.VERSION }}

      # GitHub Release with auto-generated changelog
      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        with:
          generate_release_notes: true
          body: |
            ## CNA Platform ${{ github.ref_name }}

            Docker image: `ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }}`

            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }}
            docker run --rm ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }} --help
            ```
