name: "370 · Docker Hub Registry Cleanup"
# Prunes stale SHA-tagged images pushed by 200-build-images.yml. That workflow
# fires on almost every commit to main (including dependency-bump PRs), so
# SHA tags (sha-*, api-sha-*, worker-sha-*, web-sha-*, migrator-sha-*)
# accumulate unbounded with nothing ever deleting them.
#
# Retention: for each component, keep the newest KEEP_COUNT SHA tags, plus
# the *-latest tags (never touched). Everything else older than that is deleted.
# Nothing is read from the repository: the newest build is always among the newest KEEP_COUNT tags of its
# component, so a rollback source needs no extra protection.
#
# Release tags. 310 gives each of the five images of a released build a version tag: `X.Y.Z` (the CLI image) and
# `api-X.Y.Z`, `worker-X.Y.Z`, `web-X.Y.Z`, `migrator-X.Y.Z`. They match none of the SHA patterns below, so they are
# never listed for deletion, and a `<component>-sha-<7>` tag is also KEPT when an image of it is shared with any
# tag outside the SHA patterns (the version tags, the `*-latest` tags). The comparison uses the digests Docker Hub
# lists for each tag (the tag's own `digest` and every `images[].digest`); a SHA tag that lists no digest at all is
# kept too, because sharing cannot be ruled out; and a tag outside the patterns for which Hub lists no digest at
# all stops the whole prune (nothing deleted, the job fails) for the same reason. So deleting a SHA tag can never be what removes the manifest of
# a released build. cosign's referrer tags (`sha256-<hex>`) are not part of that comparison: they point at signature
# manifests, never at an image, and there can be thousands of them.
#
# What this does NOT protect: a consumer that pins an image by digest taken from a build that was never released,
# once its `<component>-sha-<7>` tag has aged out (more than KEEP_COUNT builds of that component since). Docker Hub
# may remove a digest no tag points to (whether and when it does was not checked against its documentation), and
# cosign signatures are referrers of the digest, so the pin could stop resolving. A consumer that needs an image of
# an unreleased build should copy it to its own registry at the time it adopts it, or raise KEEP_COUNT here (the cost
# is Docker Hub storage). A release made before 310 tagged all five images covers only its CLI image.
#
# Not verified: Docker Hub's semantics of `DELETE .../tags/<tag>/` when another tag points at the same manifest. The
# current Hub API reference (https://docs.docker.com/reference/api/hub/latest/, OpenAPI file
# https://docs.docker.com/reference/api/hub/latest.yaml) documents no tag deletion at all, and documents no top-level
# `digest` on a tag, only `images[].digest`; the delete call below was confirmed against the live API by this
# workflow's author, and the rule above is there so that nothing depends on the answer.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be deleted without deleting"
        required: false
        default: "false"
        type: string
  schedule:
    - cron: '0 6 * * 1'  # weekly, Monday 06:00 UTC

permissions:
  contents: read

# Only one cleanup at a time — a scheduled run and a manual dispatch racing to
# delete the same tags would just produce duplicate 404s; serialize them.
concurrency:
  group: registry-cleanup
  cancel-in-progress: false

env:
  DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
  # The one repository this workflow prunes: the repository 200-build-images.yml publishes to
  # (same name, same convention `img-<short name>-<job>-<type>`; tests/security/test_image_repository_name.py
  # keeps the two equal). Never point this at the retired `cna` repository: it holds a different image.
  IMAGE_REPOSITORY: img-ne-appliance-app
  KEEP_COUNT: 10

jobs:
  cleanup:
    # GitHub-hosted, not self-hosted: hub.docker.com (the web/API domain used
    # here for tag listing + deletion) sits behind bot/WAF protection that
    # 403s requests from the VPS's IP before auth even runs — confirmed via
    # a direct curl test from the VPS. The separate registry domain
    # (registry-1.docker.io, used by docker login/push/pull in
    # 200-build-images.yml) is unaffected, which is why builds always work
    # fine from the VPS but this API-only job doesn't.
    runs-on: ubuntu-latest
    # A dry run lists and deletes nothing, so it may run before publishing is switched on; it proves the
    # credential, the Docker Hub listing and the retention rule. A real prune still needs DOCKERHUB_ENABLED.
    if: vars.DOCKERHUB_ENABLED == 'true' || inputs.dry_run == 'true' # owner step: Docker Hub OIDC connection + variables (REFACTOR_APP.md change set J)
    timeout-minutes: 15
    steps:
      - name: Validate Docker Hub namespace and repository
        run: |
          if [ -z "$DOCKERHUB_NAMESPACE" ]; then
            echo "::error::DOCKERHUB_NAMESPACE variable is required."
            exit 1
          fi
          if [ -z "$IMAGE_REPOSITORY" ]; then
            echo "::error::IMAGE_REPOSITORY is empty; refusing to guess which repository to prune."
            exit 1
          fi

      - name: Prune stale SHA-tagged images
        env:
          # Personal-account PAT, NOT an organisation access token
          # (see comment below — org tokens can't manage tags via the Hub API
          # at all, confirmed against the live API, not just an auth quirk).
          DOCKERHUB_PERSONAL_USERNAME: ${{ vars.DOCKERHUB_PERSONAL_USERNAME }}
          DOCKERHUB_PERSONAL_TOKEN: ${{ secrets.DOCKERHUB_PERSONAL_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          KEEP="${KEEP_COUNT}"

          # Tags that must never be deleted regardless of age.
          PROTECTED_RAW="latest api-latest worker-latest web-latest migrator-latest"

          echo "Protected: $PROTECTED_RAW"

          if [ -z "$DOCKERHUB_PERSONAL_USERNAME" ] || [ -z "$DOCKERHUB_PERSONAL_TOKEN" ]; then
            echo "::error::DOCKERHUB_PERSONAL_USERNAME variable and DOCKERHUB_PERSONAL_TOKEN secret are required."
            exit 1
          fi

          # Docker Hub API auth — DOCKERHUB_NAMESPACE ("hybridcloudworks") is
          # an Organization account, and org access tokens
          # (the builds log in through OIDC and need none) cannot manage tags via the
          # Hub REST API at all — confirmed against the live API through
          # three failure modes, not just an auth quirk:
          #   - POST /v2/users/login/ (username+password session exchange)
          #     rejects it outright: "Cannot log into an organization account".
          #   - Using the org token directly as `Authorization: Bearer` is
          #     also rejected: "A personal access token or organization
          #     access token cannot be used as a bearer."
          #   - Even after the correct /v2/auth/token exchange, the resulting
          #     JWT is rejected at the tags endpoint specifically: "token
          #     issued from organization access token is not allowed".
          # So this needs a personal-account PAT instead (a member of the
          # org, not the org's own token) exchanged via POST /v2/auth/token
          # for a short-lived (10 min) JWT to use as the actual Bearer token.
          # DOCKERHUB_NAMESPACE is still used below to address the org's
          # repositories — a personal account's token can manage tags on any
          # repo it has admin/write access to, regardless of namespace.
          AUTH_RESPONSE=$(curl -s -w "\n%{http_code}" -H "Content-Type: application/json" -X POST \
            -d "{\"identifier\": \"${DOCKERHUB_PERSONAL_USERNAME}\", \"secret\": \"${DOCKERHUB_PERSONAL_TOKEN}\"}" \
            https://hub.docker.com/v2/auth/token)
          AUTH_STATUS=$(tail -n1 <<<"$AUTH_RESPONSE")
          AUTH_BODY=$(sed '$d' <<<"$AUTH_RESPONSE")
          TOKEN=$(jq -r '.access_token // empty' <<<"$AUTH_BODY")

          if [ -z "$TOKEN" ]; then
            echo "::error::Failed to authenticate to Docker Hub API (HTTP $AUTH_STATUS)."
            echo "Response body: $AUTH_BODY"
            exit 1
          fi

          # Component name -> SHA-tag regex (matches the sha_prefix values in
          # 200-build-images.yml). cosign (T-703) stores each image's signature
          # and attestation as OCI referrers of its digest — on a registry
          # without the Referrers API, under a `sha256-<digest>` index tag.
          # Neither form matches these patterns, so nothing here can delete a
          # signature; the referrers orphaned when an image's last tag goes are
          # TODO.md T-718.
          declare -A COMPONENT_PATTERNS=(
            ["cli"]="^sha-[0-9a-f]+$"
            ["api"]="^api-sha-[0-9a-f]+$"
            ["worker"]="^worker-sha-[0-9a-f]+$"
            ["web"]="^web-sha-[0-9a-f]+$"
            ["migrator"]="^migrator-sha-[0-9a-f]+$"
          )

          # Fetch the full tag list once (paginated), newest first.
          ALL_TAGS_JSON=$(mktemp)
          echo "[]" > "$ALL_TAGS_JSON"
          URL="https://hub.docker.com/v2/repositories/${DOCKERHUB_NAMESPACE}/${IMAGE_REPOSITORY}/tags/?page_size=100&ordering=-last_updated"
          while [ -n "$URL" ] && [ "$URL" != "null" ]; do
            PAGE_RESPONSE=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer ${TOKEN}" "$URL")
            PAGE_STATUS=$(tail -n1 <<<"$PAGE_RESPONSE")
            PAGE=$(sed '$d' <<<"$PAGE_RESPONSE")

            if [ "$PAGE_STATUS" != "200" ] || [ "$(jq 'has("results")' <<<"$PAGE" 2>/dev/null)" != "true" ]; then
              echo "::error::Unexpected response listing tags (HTTP $PAGE_STATUS)."
              echo "URL: $URL"
              echo "Response body: $PAGE"
              exit 1
            fi

            # `digests` = the tag's own digest (the index, when Hub reports it) and every image digest listed for it.
            jq -c '[.results[] | {name: .name, last_updated: .last_updated, digests: (([.digest] + [(.images // [])[].digest]) | map(select(. != null and . != "")) | unique)}]' <<<"$PAGE" > /tmp/page.json
            jq -s '.[0] + .[1]' "$ALL_TAGS_JSON" /tmp/page.json > /tmp/merged.json
            mv /tmp/merged.json "$ALL_TAGS_JSON"
            URL=$(jq -r '.next // empty' <<<"$PAGE")
          done

          TOTAL=$(jq 'length' "$ALL_TAGS_JSON")
          echo "Fetched $TOTAL total tags from Docker Hub."

          # Every digest that a tag OUTSIDE the SHA patterns points to (version tags, *-latest), as an object
          # {"sha256:...": true} in a FILE. It is never passed as an argument: cosign's referrer tags
          # (sha256-<hex>, never pruned, TODO.md T-718) make the tag list grow without bound, and one argument
          # over 128 KiB ends the job with "Argument list too long". Referrer tags are left out of the set.
          PATTERNS_JSON=$(printf '%s\n' "${COMPONENT_PATTERNS[@]}" | jq -R . | jq -sc .)
          PERMANENT_FILE=$(mktemp)
          jq -c --argjson pats "$PATTERNS_JSON" \
            '[.[] | select((.name as $n | any($pats[]; . as $p | $n | test($p))) | not)
                  | select(.name | test("^sha256-[0-9a-f]{64}([.](sig|att|sbom))?$") | not)
                  | .digests[]] | unique | map({(.): true}) | add // {}' \
            "$ALL_TAGS_JSON" > "$PERMANENT_FILE"

          # Fail closed: a version or latest tag for which Docker Hub lists no digest at all could share an image with
          # a SHA tag, and cannot be compared. Nothing is deleted until that is looked at.
          mapfile -t NO_DIGEST < <(jq -r --argjson pats "$PATTERNS_JSON" \
            '.[] | select((.name as $n | any($pats[]; . as $p | $n | test($p))) | not)
                 | select(.name | test("^sha256-[0-9a-f]{64}([.](sig|att|sbom))?$") | not)
                 | select((.digests | length) == 0) | .name' \
            "$ALL_TAGS_JSON")
          if [ "${#NO_DIGEST[@]}" -gt 0 ]; then
            echo "::error::Docker Hub lists no digest for the tag(s) ${NO_DIGEST[*]}, so it cannot be ruled out that a SHA tag shares their image; nothing was deleted. Look at them on Docker Hub (Repository, Tags) first."
            exit 1
          fi

          DELETED=0
          FAILED=0
          KEPT=0
          KEPT_SHARED=0

          for component in "${!COMPONENT_PATTERNS[@]}"; do
            pattern="${COMPONENT_PATTERNS[$component]}"
            # Newest-first rows "<tag><TAB><own|shared|unknown>" for this component's SHA pattern: `shared` when one
            # of the tag's digests is also a digest of a tag outside the patterns, `unknown` when Hub lists none.
            mapfile -t rows < <(jq -r --arg pat "$pattern" --slurpfile perm "$PERMANENT_FILE" \
              '[.[] | select(.name | test($pat))] | sort_by(.last_updated) | reverse | .[]
               | [.name, (if (.digests | length) == 0 then "unknown" elif (.digests | any(. as $d | $perm[0][$d] == true)) then "shared" else "own" end)]
               | @tsv' \
              "$ALL_TAGS_JSON")

            echo "--- $component: ${#rows[@]} SHA-tagged images ---"
            i=0
            for row in "${rows[@]}"; do
              i=$((i + 1))
              tag="${row%%$'\t'*}"
              sharing="${row#*$'\t'}"
              protected=false
              for p in $PROTECTED_RAW; do
                [ "$tag" = "$p" ] && protected=true && break
              done

              if [ "$protected" = true ] || [ "$i" -le "$KEEP" ]; then
                KEPT=$((KEPT + 1))
                continue
              fi

              if [ "$sharing" != "own" ]; then
                echo "keeping: $tag (${sharing}: a tag outside the SHA patterns lists the same image, or Docker Hub lists no digest for it)"
                KEPT=$((KEPT + 1))
                KEPT_SHARED=$((KEPT_SHARED + 1))
                continue
              fi

              if [ "$DRY_RUN" = "true" ]; then
                echo "would delete: $tag"
                DELETED=$((DELETED + 1))
              else
                echo "deleting: $tag"
                # Count only what Docker Hub confirmed. The API token lasts 10 minutes, so a long
                # run can start getting 401s; those must fail the job, not read as "deleted".
                STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
                  -H "Authorization: Bearer ${TOKEN}" \
                  "https://hub.docker.com/v2/repositories/${DOCKERHUB_NAMESPACE}/${IMAGE_REPOSITORY}/tags/${tag}/" || echo 000)
                case "$STATUS" in
                  200|202|204) echo "  -> HTTP $STATUS"; DELETED=$((DELETED + 1)) ;;
                  404) echo "  -> HTTP 404 (already gone)" ;;
                  *) echo "::error::Could not delete ${tag} (HTTP ${STATUS})."; FAILED=$((FAILED + 1)) ;;
                esac
              fi
            done
          done

          echo ""
          echo "Summary: kept $KEPT ($KEPT_SHARED of them because a release or other non-SHA tag shares their image), $([ "$DRY_RUN" = "true" ] && echo "would delete" || echo "deleted") $DELETED (retention: last $KEEP per component + *-latest)."
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED tag(s) could not be deleted; the summary above counts only confirmed deletions."
            exit 1
          fi
