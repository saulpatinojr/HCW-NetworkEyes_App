name: landingzone
version: 1.0.0
display_name: Cloud Landing Zone Assessment
status: installed
description: >
  Documents and assesses AWS and Azure landing zone architectures.
  DD-011: Produces Mermaid-based detail documentation only —
  not deployable IaC. We present and recommend, we do not deploy.
depends_on: [network]
required_permissions:
  aws:
    - organizations:DescribeOrganization
    - organizations:ListAccounts
    - organizations:ListOrganizationalUnitsForParent
    - organizations:ListPolicies
  azure:
    - Microsoft.Management/managementGroups/read
    - Microsoft.Management/managementGroups/descendants/read
ai_recommendations_enabled: true
