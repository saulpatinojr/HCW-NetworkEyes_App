name: security
version: 1.0.0
display_name: Network Security Assessment
status: installed
description: >
  Assesses cloud network security posture including security groups,
  NSGs, Azure and AWS Firewall, WAF, DDoS protection, and threat detection.
depends_on: [network]
required_permissions:
  aws:
    - ec2:DescribeSecurityGroups
    - ec2:DescribeNetworkAcls
    - network-firewall:DescribeFirewall
    - network-firewall:DescribeFirewallPolicy
    - network-firewall:DescribeRuleGroup
    - wafv2:GetWebACL
    - wafv2:ListWebACLs
    - shield:DescribeProtection
    - guardduty:GetDetector
    - guardduty:ListFindings
  azure:
    - Microsoft.Network/networkSecurityGroups/read
    - Microsoft.Network/networkSecurityGroups/securityRules/read
    - Microsoft.Network/azureFirewalls/read
    - Microsoft.Network/firewallPolicies/read
    - Microsoft.Security/assessments/read
    - Microsoft.Security/securitySolutions/read
ai_recommendations_enabled: true
framework_mappings:
  - name: CIS AWS Foundations Benchmark
    version: "3.0"
  - name: Azure Security Benchmark
    version: v3
  - name: NIST SP 800-207
    version: "2020"
  - name: CISA Zero Trust Maturity Model
    version: v2
