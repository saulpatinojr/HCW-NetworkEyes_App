# AWS half of the network module's permissions (REFACTOR_APP.md change set K).
# Split from module.yaml so the Azure-only install (no [aws] extra) carries no
# AWS permission list; the discovery code that needs these imports boto3 behind
# cna.aws.require_aws_extra(). The IAM policy the AWS appliance's Terraform
# builds from this list is [VERIFY] against the actions the collectors call.
name: network
cloud: aws
required_permissions:
  aws:
    - ec2:DescribeVpcs
    - ec2:DescribeSubnets
    - ec2:DescribeRouteTables
    - ec2:DescribeInternetGateways
    - ec2:DescribeNatGateways
    - ec2:DescribeTransitGateways
    - ec2:DescribeTransitGatewayAttachments
    - ec2:DescribeTransitGatewayRouteTables
    - ec2:DescribeVpcPeeringConnections
    - ec2:DescribeVpnConnections
    - ec2:DescribeVpnGateways
    - ec2:DescribeCustomerGateways
    - directconnect:DescribeConnections
    - directconnect:DescribeVirtualInterfaces
    - networkmanager:GetNetworkTopology
