# AWS half of the network module's permissions (REFACTOR_APP.md change set K).
# Split from module.yaml so the Azure-only install (no [aws] extra) carries no
# AWS permission list; the discovery code that needs these imports boto3 behind
# cna.aws.require_aws_extra().
#
# Checked 2026-10-25: this list is exactly the API calls made by
# cna/modules/network/discovery/aws_discovery.py (one IAM action per boto3 call; the last
# two lines are only needed for the multi-account path), and every action
# name exists in the AWS Service Authorization Reference
# (https://docs.aws.amazon.com/service-authorization/latest/reference/reference_policies_actions-resources-contextkeys.html).
# Five actions that earlier versions of this file listed but no collector calls were removed
# (ec2:DescribeTransitGatewayRouteTables, ec2:DescribeVpnConnections,
# ec2:DescribeCustomerGateways, directconnect:DescribeVirtualInterfaces,
# networkmanager:GetNetworkTopology). Add one back in the same change that adds the call.
name: network
cloud: aws
required_permissions:
  aws:
    - ec2:DescribeRegions
    - ec2:DescribeVpcs
    - ec2:DescribeSubnets
    - ec2:DescribeRouteTables
    - ec2:DescribeInternetGateways
    - ec2:DescribeNatGateways
    - ec2:DescribeVpcPeeringConnections
    - ec2:DescribeSecurityGroups
    - ec2:DescribeNetworkAcls
    - ec2:DescribeTransitGateways
    - ec2:DescribeTransitGatewayAttachments
    - ec2:DescribeVpnGateways
    - directconnect:DescribeConnections
    - network-firewall:ListFirewalls
    - network-firewall:DescribeFirewall
    - network-firewall:DescribeLoggingConfiguration
    - wafv2:ListWebACLs
    - wafv2:GetWebACL
    - wafv2:ListResourcesForWebACL
    # Multi-account path only (a management session lists the organisation and assumes a role
    # in each member account).
    - organizations:ListAccounts
    - sts:AssumeRole
