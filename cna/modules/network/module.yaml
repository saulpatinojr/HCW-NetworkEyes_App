name: network
version: 1.0.0
display_name: Cloud Network Assessment
status: installed
description: >
  Discovers and documents AWS and Azure network topology including VPCs,
  VNets, subnets, routing tables, Transit Gateways, VPN, ExpressRoute,
  peering connections, and Cloud WAN / Virtual WAN.
depends_on: []
required_permissions:
  # AWS: cna/modules/network/module.aws.yaml (the [aws] extra, REFACTOR_APP.md change set K).
  # Azure: the scan is read-only. Reader on each assessed scope covers every list/read
  # call; the optional built-in reader roles cover Defender, cost and Log Analytics; the
  # six POST actions that return BGP state without changing anything are the custom role
  # docs/roles/cna-network-bgp-reader.json ("CNA Network BGP Reader"). Every action name
  # below is [VERIFY actions] against the current Microsoft.Network provider operations
  # (REFACTOR_APP.md change set F, section 13). [REVIEW REQUIRED] role decisions.
  azure:
    - Microsoft.Resources/subscriptions/resourceGroups/read  # [VERIFY actions] Reader
    - Microsoft.ResourceGraph/resources/read  # [VERIFY actions] Reader
    - Microsoft.Network/*/read  # [VERIFY actions] Reader
    - Microsoft.Insights/diagnosticSettings/read  # [VERIFY actions] Reader
    - Microsoft.Insights/Metrics/read  # [VERIFY actions] Reader
    - Microsoft.Security/assessments/read  # [VERIFY actions] Security Reader
    - Microsoft.CostManagement/query/action  # [VERIFY actions] Cost Management Reader
    - Microsoft.OperationalInsights/workspaces/query/read  # [VERIFY actions] Log Analytics Reader
    - Microsoft.Network/virtualNetworkGateways/getBgpPeerStatus/action  # [VERIFY actions] CNA Network BGP Reader
    - Microsoft.Network/virtualNetworkGateways/getLearnedRoutes/action  # [VERIFY actions] CNA Network BGP Reader
    - Microsoft.Network/virtualNetworkGateways/getAdvertisedRoutes/action  # [VERIFY actions] CNA Network BGP Reader
    - Microsoft.Network/virtualHubs/bgpConnections/learnedRoutes/action  # [VERIFY actions] CNA Network BGP Reader
    - Microsoft.Network/virtualHubs/bgpConnections/advertisedRoutes/action  # [VERIFY actions] CNA Network BGP Reader
    - Microsoft.Network/expressRouteCircuits/peerings/routeTables/read  # [VERIFY actions] CNA Network BGP Reader
ai_recommendations_enabled: true
framework_mappings:
  - name: AWS Well-Architected Framework
    version: "2024"
    pillar: Reliability
  - name: Azure Well-Architected Framework
    version: "2024"
    pillar: Reliability
