name: network
version: 1.0.0
display_name: Cloud Network Assessment
status: installed
description: >
  Discovers and documents AWS and Azure network topology including VPCs,
  VNets, subnets, routing tables, Transit Gateways, VPN, ExpressRoute,
  peering connections, and Cloud WAN / Virtual WAN.
depends_on: []
required_permissions:
  aws:
    - ec2:DescribeVpcs
    - ec2:DescribeSubnets
    - ec2:DescribeRouteTables
    - ec2:DescribeInternetGateways
    - ec2:DescribeNatGateways
    - ec2:DescribeTransitGateways
    - ec2:DescribeTransitGatewayAttachments
    - ec2:DescribeTransitGatewayRouteTables
    - ec2:DescribeVpcPeeringConnections
    - ec2:DescribeVpnConnections
    - ec2:DescribeVpnGateways
    - ec2:DescribeCustomerGateways
    - directconnect:DescribeConnections
    - directconnect:DescribeVirtualInterfaces
    - networkmanager:GetNetworkTopology
  azure:
    - Microsoft.Network/virtualNetworks/read
    - Microsoft.Network/virtualNetworks/subnets/read
    - Microsoft.Network/routeTables/read
    - Microsoft.Network/virtualHubs/read
    - Microsoft.Network/virtualWans/read
    - Microsoft.Network/expressRouteCircuits/read
    - Microsoft.Network/virtualNetworkGateways/read
    - Microsoft.Network/localNetworkGateways/read
ai_recommendations_enabled: true
framework_mappings:
  - name: AWS Well-Architected Framework
    version: "2024"
    pillar: Reliability
  - name: Azure Well-Architected Framework
    version: "2024"
    pillar: Reliability
