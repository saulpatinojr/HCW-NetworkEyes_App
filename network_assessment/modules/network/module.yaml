name: network
version: 1.0.0
display_name: Cloud Network Assessment
status: installed
description: >
  Discovers and documents AWS and Azure network topology including VPCs,
  VNets, subnets, routing tables, Transit Gateways, VPN, ExpressRoute,
  peering connections, and Cloud WAN / Virtual WAN.
depends_on: []
required_permissions:
  # AWS: network_assessment/modules/network/module.aws.yaml (the [aws] extra, REFACTOR_APP.md change set K).
  # Azure: the scan is read-only. Reader on each assessed scope covers every list/read
  # call; the optional built-in reader roles cover Defender, cost and Log Analytics; the
  # six POST actions that return BGP state without changing anything are the custom role
  # docs/roles/network-assessment-bgp-reader.json ("Network Assessment BGP Reader"). Checked 2026-10-25:
  # every action name below is listed in the Microsoft Learn Azure permissions reference
  # (https://learn.microsoft.com/azure/role-based-access-control/permissions/networking,
  # .../management-and-governance, .../monitor and .../security); `Microsoft.Network/*/read`
  # is a wildcard and so is not listed there, it is the read part of the built-in Reader role
  # (REFACTOR_APP.md change set F, section 13). [REVIEW REQUIRED] role decisions.
  azure:
    - Microsoft.Resources/subscriptions/resourceGroups/read  # Reader
    - Microsoft.ResourceGraph/resources/read  # Reader
    - Microsoft.Network/*/read  # Reader
    - Microsoft.Insights/diagnosticSettings/read  # Reader
    - Microsoft.Insights/Metrics/read  # Reader
    - Microsoft.Security/assessments/read  # Security Reader
    - Microsoft.CostManagement/query/action  # Cost Management Reader
    - Microsoft.OperationalInsights/workspaces/query/read  # Log Analytics Reader
    - Microsoft.Network/virtualNetworkGateways/getBgpPeerStatus/action  # Network Assessment BGP Reader
    - Microsoft.Network/virtualNetworkGateways/getLearnedRoutes/action  # Network Assessment BGP Reader
    - Microsoft.Network/virtualNetworkGateways/getAdvertisedRoutes/action  # Network Assessment BGP Reader
    - Microsoft.Network/virtualHubs/bgpConnections/learnedRoutes/action  # Network Assessment BGP Reader
    - Microsoft.Network/virtualHubs/bgpConnections/advertisedRoutes/action  # Network Assessment BGP Reader
    - Microsoft.Network/expressRouteCircuits/peerings/routeTables/read  # Network Assessment BGP Reader
ai_recommendations_enabled: true
framework_mappings:
  - name: AWS Well-Architected Framework
    version: "2024"
    pillar: Reliability
  - name: Azure Well-Architected Framework
    version: "2024"
    pillar: Reliability
