[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cna-azure-network-engine"
version = "0.1.0"
description = "Azure network assessment engine: topology model, typed rule registry, classifier, Resource Graph normalizer and report renderers. Base install needs pydantic only."
requires-python = ">=3.14"
# The base distribution carries no cloud SDK: the downstream lab edition installs it to
# prove it cannot reach Azure (tests/security/test_edition_boundary.py there). Discovery
# lives behind the [azure] extra (change set D of REFACTOR_APP.md).
dependencies = [
    "pydantic>=2.13,<3",
]
# [REVIEW REQUIRED] licence and copyright holder: REFACTOR_APP.md section 22, item 1.

[project.optional-dependencies]
# Live discovery (change set D). Lower bounds are the versions the code was written
# against; upper bounds follow the monorepo's `enrichment` extra (TODO.md T-413, T-414),
# whose majors renamed or removed the APIs used. Every bound is [VERIFY] until the
# acceptance run against a Reader-only identity (TODO.md T-726).
azure = [
    "azure-identity>=1.26.0",                 # [VERIFY] credential chain
    "azure-mgmt-resourcegraph>=8.0.0,<9",     # [VERIFY] QueryRequest/QueryRequestOptions, skip_token
    "azure-mgmt-network>=33.1.0",             # [VERIFY] BGP begin_get_* actions (live only)
    "azure-mgmt-monitor>=7.0.0,<8",           # [VERIFY] diagnostic settings, alert counts
    "azure-monitor-query>=2.0.0,<3",          # [VERIFY] metrics, Traffic Analytics
    "azure-mgmt-costmanagement>=5.0.0,<6",    # [VERIFY] AZ-COST live reads
    "azure-mgmt-loganalytics>=14.0.0,<15",    # [VERIFY] workspace lookup
]
# Not needed any more: Defender assessments and NVAs come from Resource Graph
# (SecurityResources, Resources), so azure-mgmt-security and azure-mgmt-compute are gone.

[tool.setuptools.packages.find]
include = ["cna_azure_network_engine*"]

[tool.setuptools.package-data]
cna_azure_network_engine = ["py.typed"]

[tool.coverage.run]
source = ["cna_azure_network_engine"]

[tool.coverage.report]
fail_under = 85
