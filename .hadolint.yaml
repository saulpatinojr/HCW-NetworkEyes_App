# hadolint configuration for the four Dockerfiles (Dockerfile, apps/cna-api, apps/cna-worker, apps/cna-web).
# Run from the repository root; CI (`Dockerfile Lint (hadolint)` in 300-test-codebase.yml) and
# scripts/ci/local-container-checks.sh both pass this file with --config.
#
# House rule: a rule is ignored here only with a written reason, in this file, next to the rule id. Anything
# narrower than a whole rule (one line) is ignored in the Dockerfile itself with `# hadolint ignore=DLxxxx` and
# a reason above it. Everything else hadolint reports is fixed, not ignored. Changing the ignore list is a
# reviewed change; tests/unit/test_ci_hygiene.py fails when an ignored rule has no reason or is not in the
# approved set below.

# Fail on every severity, including `info` and `style`, so a new finding of any kind turns the check red.
failure-threshold: style

ignored:
  # DL3008 (pin apt-get package versions) and DL3018 (pin apk package versions).
  #
  # Why ignored: the Debian and Alpine mirrors keep only the current build of each package in a release. A pin
  # such as `libcairo2=1.18.4-1` stops installing the day the distribution ships a security update, and nothing
  # in this repository moves it forward: Dependabot's docker ecosystem reads FROM lines, not apt or apk pins.
  # The result would be an image build that fails without a code change, or a pin that someone loosens under
  # pressure. The reproducibility the rule is meant to give comes from the base image instead:
  #   * every FROM is pinned by sha256 digest (tests/unit/test_ci_hygiene.py checks this), and Dependabot opens
  #     a pull request for each new digest every Monday;
  #   * the packages installed on top are few and named in the Dockerfiles (graphviz and the cairo/pango
  #     libraries, xvfb for draw.io, libc6-compat on Alpine) and never upgraded in place (no `apt-get upgrade`,
  #     no `apk upgrade`);
  #   * Python and npm dependencies are not covered by this rule and are locked with hashes (uv.lock,
  #     package-lock.json);
  #   * 200-build-images.yml scans each pushed digest with Docker Scout and refuses fixable critical or high
  #     findings, and scripts/ci/local-container-checks.sh runs a Trivy scan with the same intent.
  # Revisit if the images move to a Debian snapshot mirror (then the pins would be stable and checkable).
  - DL3008
  - DL3018
