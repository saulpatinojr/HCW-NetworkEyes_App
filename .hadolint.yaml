# hadolint configuration for the three Dockerfiles (Dockerfile, apps/network-assessment-api, apps/network-assessment-web).
# Run from the repository root; CI (`Dockerfile Lint (hadolint)` in 300-test-codebase.yml) and
# scripts/ci/local-container-checks.sh both pass this file with --config.
#
# House rule: a rule is ignored here only with a written reason, in this file, next to the rule id. Anything
# narrower than a whole rule (one line) is ignored in the Dockerfile itself with `# hadolint ignore=DLxxxx` and
# a reason above it. Everything else hadolint reports is fixed, not ignored. Changing the ignore list is a
# reviewed change; tests/unit/test_ci_hygiene.py fails when an ignored rule has no reason or is not in the
# approved set below.

# Fail on every severity, including `info` and `style`, so a new finding of any kind turns the check red.
failure-threshold: style

ignored:
  # DL3008 (pin apt-get package versions).
  #
  # Why ignored: the Debian mirrors keep only the current build of each package in a release. A pin
  # such as `libcairo2=1.18.4-1` stops installing the day the distribution ships a security update, and nothing
  # in this repository moves it forward: Dependabot's docker ecosystem reads FROM lines, not apt pins.
  # The result would be an image build that fails without a code change, or a pin that someone loosens under
  # pressure.
  #
  # What this means, stated plainly: the base image is fixed by digest, but the packages installed on top are
  # NOT. A rebuild on another day installs that day's versions of them, so two builds of one commit can differ in
  # those packages; this file does not make the images reproducible. What bounds the risk instead:
  #   * every FROM is pinned by sha256 digest (tests/unit/test_ci_hygiene.py checks this), and Dependabot opens
  #     a pull request for each new digest every Monday;
  #   * the packages installed on top are few and named in the Dockerfiles (graphviz and the cairo/pango
  #     libraries, xvfb for draw.io, curl and unzip in the web image's build-only draw.io stage), and every
  #     shipped final stage first applies Debian's security updates (`apt-get upgrade`, TODO.md T-741), because a security
  #     upload reaches the mirrors days before the official base image is rebuilt with it (CVE-2026-109518,
  #     2026-11-05: no python:3.14-slim digest existed without it, so the digest bump alone could not clear Scout);
  #   * Python and npm dependencies are not covered by this rule and are locked with hashes (uv.lock,
  #     package-lock.json);
  #   * THE real control: 200-build-images.yml scans each pushed digest with Docker Scout and refuses fixable
  #     critical or high findings before any tag moves, and scripts/ci/local-container-checks.sh runs a Trivy
  #     scan with the same intent.
  # Revisit if the images move to a Debian snapshot mirror (then the pins would be stable and checkable).
  # DL3018 (the same rule for Alpine's apk) was ignored here too until 2026-11-07, when the web image moved from
  # node:24-alpine to node:24-trixie-slim: no Dockerfile uses apk any more, so the ignore was removed rather than
  # kept unused, and tests/unit/test_ci_hygiene.py no longer approves it.
  - DL3008
