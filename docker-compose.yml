# docker-compose.yml — hardened
# Changes from original:
#   - version field removed (deprecated in Compose v2; causes warnings)
#   - image: field added to network-assessment service (run pre-built image OR build)
#   - read_only: true on network-assessment service (filesystem is immutable at runtime)
#   - tmpfs for /tmp (needed by WeasyPrint PDF render and Jinja2 temp writes)
#   - security_opt: no-new-privileges
#   - Engagement + output volumes: ro on network-assessment (read-only in prod service)
#   - network-assessment-dev: mounts source read-write for live editing
#   - network-assessment-test: dedicated test runner, no .env leak into prod runs
#   - Explicit network (no default bridge sharing with other compose projects)

services:

  network-assessment:
    build: .
    image: network-assessment:local
    read_only: true
    tmpfs:
      - /tmp:size=512m
    security_opt:
      - no-new-privileges:true
    env_file: .env
    volumes:
      - ./engagements:/app/engagements:rw
      - ./output:/app/output:rw
    command: ["--help"]
    networks:
      - network-assessment-internal

  network-assessment-dev:
    build: .
    volumes:
      - .:/app:rw
    env_file: .env
    entrypoint: ["python", "-m", "pytest", "tests/", "-v", "--tb=short"]
    networks:
      - network-assessment-internal

  network-assessment-test:
    build: .
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./tests:/app/tests:ro
    env_file: .env
    entrypoint: [
      "python", "-m", "pytest", "tests/unit/",
      "-v", "--tb=short",
      "--cov=network_assessment", "--cov-report=term-missing"
    ]
    networks:
      - network-assessment-internal

  # Web_Service fallback path (Requirement 7.2): run the Next.js front end
  # locally without the cloud. Builds the runner stage of the web image, which
  # ships as non-root (USER 1001, the `nextjs` user) with its own HEALTHCHECK.
  network-assessment-web:
    build:
      context: ./apps/network-assessment-web
      target: runner
    image: network-assessment-web:local
    security_opt:
      - no-new-privileges:true
    env_file: .env
    ports:
      - "3000:3000"
    networks:
      - network-assessment-internal

networks:
  network-assessment-internal:
    driver: bridge
