# Pre-commit hooks — run on every git commit
# Install: pre-commit install
# Run manually: pre-commit run --all-files
#
# All hooks are pinned to SHA (supply chain security, consistent with CI workflow pins)

repos:
  # --- Secret detection ---
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: gitleaks (secret detection)

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: ^\.env\.example$

  # --- Python linting ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.10
    hooks:
      - id: ruff
        name: ruff lint
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        name: ruff format

  # --- General hygiene ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: no-commit-to-branch
        args: [--branch, main]
        name: no direct commit to main

  # --- Type checking (TODO.md T-402) ---
  # `repo: local` / `language: system` so this runs the exact `ty` version
  # pinned in pyproject.toml's `dev` group — no second place to bump, and no
  # third-party rev to pin.
  #
  # NOT gating yet: `ty check cna/` currently reports 96 diagnostics. T-402 is
  # explicit that ignore lists must not be widened to force a green first run,
  # so the backlog is tracked in TODO.md T-410 and fixed instead. Run it with:
  #
  #     pre-commit run ty --hook-stage manual --all-files
  #
  # When T-410 closes, delete the `stages:` line so it gates like the rest.
  - repo: local
    hooks:
      - id: ty
        name: ty (type check — not yet gating, see TODO.md T-410)
        entry: ty check
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]
