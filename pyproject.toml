[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cna"
version = "0.8.0b0"
description = "Cloud Network Assessment Platform CLI"
requires-python = ">=3.11"
dependencies = [
    "click>=8.4.2",
    "rich>=15.0.0",
    "boto3>=1.43.40",
    "azure-identity>=1.25.3",
    "azure-ai-projects>=2.3.0",          # Foundry Agent Service: recommendation enrichment
    "azure-mgmt-network>=31.0.1",
    "azure-mgmt-resource>=26.0.0",
    "azure-mgmt-subscription>=3.1.1",
    "azure-storage-blob>=12.30.0",       # Phase F: Azure Blob Storage deployer
    "openai>=2.45.0",
    "diagrams>=0.25.1",
    "n2g>=0.3.3",
    "matplotlib>=3.10.9",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "jinja2>=3.1.6",
    "weasyprint>=62.0",                # Phase E: PDF generation
    "markdown>=3.10.2",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "tenacity>=9.1.4",
    "httpx>=0.28.1",
]

[project.scripts]
cna = "cna.cli.main:cli"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",               # coverage plugin (was missing from dev deps)
    "ruff>=0.15.21",
    "pre-commit>=4.6.0",               # pre-commit itself as a dev dep
    "detect-secrets>=1.5",           # used by pre-commit hook
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py311"
# .claude, .agents, and .codex are vendored Claude Code agent/skill/tooling
# configuration, not this repo's own source — they aren't held to project lint
# standards. Kept in sync with EXCLUDED_DIRS in
# scripts/validate_documentation_model.py and the README "Repository
# conventions" section (TODO.md T-607).
extend-exclude = [".claude", ".agents", ".codex"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "N",   # pep8-naming
]
ignore = [
    "E501",   # line too long (ruff format handles this)
    "S101",   # use of assert (acceptable in tests)
    "S603",   # subprocess call (needed for diagram export)
    "S607",   # partial executable path (needed for diagram export)
    "N818",   # exception name without Error suffix — intentional (CNAPartialResult, ObservedStateViolation, etc.)
    "S108",   # /tmp usage — acceptable in containerised CLI/worker images
    "S311",   # pseudo-random — used for jitter/throttle, not cryptography
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "N"]   # relax security + naming rules in tests
"cna/diagram_engine/diagrams_generator.py" = ["N811"]  # VPC imported as SubnetNode is a deliberate alias

[tool.coverage.run]
source = ["cna"]
omit = [
    # CLI entry points — covered by integration tests, not unit tests
    "cna/cli/*",
    "*/__init__.py",
    "*/migrations/*",

    # Discovery modules — require live AWS/Azure API calls against real tenants.
    # Covered by integration tests run against sandboxed tenants.
    "cna/modules/network/discovery/aws_discovery.py",
    "cna/modules/network/discovery/azure_discovery.py",

    # Diagram generation — require graphviz binary + drawio runtime
    # (Round 3: add `apt-get install graphviz` to CI and remove these)
    "cna/diagram_engine/diagrams_generator.py",
    "cna/modules/network/diagrams/*",
    "cna/modules/landingzone/diagrams/*",

    # Modules registry (pure config, no logic)
    "cna/modules/registry.py",
]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@overload",
]

[tool.setuptools.packages.find]
include = ["cna*"]
